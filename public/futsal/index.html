<html lang="pt-PT">
<head>

<title>Futsal 3S</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F6EEE4; --card:#FFFDF9; --ink:#1B2A4A; --soft:#5E6782; --faint:#A3A9BA;
  --navy:#1B2A4A; --navy-soft:#E7EAF1; --gold:#B3843F; --gold-soft:#F2E5D1;
  --mint:#4F8466; --mint-soft:#E2EDE5; --red:#B5483E; --red-soft:#F6DEDA;
  --line:#E8DDCF; --shadow:rgba(27,42,74,.08); --r:20px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
h1,h2,h3{font-family:'Baloo 2','Inter',sans-serif;font-weight:600;margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
[hidden]{display:none!important}
#app{width:100%;max-width:460px;min-height:100%;display:flex;flex-direction:column;position:relative}
header.top{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 44px;background:var(--navy);color:#fff;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
header.top::after{content:'';position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;border:1.5px solid var(--gold);opacity:.6}
header.top .sub{font-size:13px;opacity:.75;margin-bottom:2px}
header.top h1{font-size:24px;color:#fff}
header.top .team{display:inline-flex;gap:6px;align-items:center;margin-top:8px;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:99px;font-size:12px;border:0;color:#fff}
main{flex:1;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));margin-top:-26px;position:relative;z-index:1}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 6px 20px var(--shadow);margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:8px}
.card h3{font-size:15px;margin-bottom:6px}
.muted{color:var(--soft);font-size:13px}
.faint{color:var(--faint);font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold)}
.btn.ghost{background:var(--navy-soft);color:var(--navy)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--navy-soft);color:var(--navy)}
.chip.gold{background:var(--gold-soft);color:#7d5a22}
.chip.mint{background:var(--mint-soft);color:var(--mint)}
.chip.red{background:var(--red-soft);color:var(--red)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;white-space:nowrap;padding:8px 13px;border-radius:99px;background:var(--card);color:var(--soft);font-weight:600;font-size:13px;box-shadow:0 2px 8px var(--shadow)}
.seg button.on{background:var(--navy);color:#fff}
.list>*{border-top:1px solid var(--line);padding:11px 0}
.list>*:first-child{border-top:0;padding-top:2px}
.item{display:flex;gap:12px;align-items:center;background:none;border:0;width:100%;text-align:left;color:inherit;padding:0}
.av{width:42px;height:42px;border-radius:14px;background:var(--gold-soft);color:#7d5a22;display:grid;place-items:center;font-weight:700;font-family:'Baloo 2';font-size:17px;flex:none}
.av.navy{background:var(--navy-soft);color:var(--navy)}
.date{width:46px;text-align:center;flex:none;background:var(--navy-soft);border-radius:12px;padding:5px 0;line-height:1.1}
.date b{display:block;font-family:'Baloo 2';font-size:19px}
.date small{font-size:11px;color:var(--soft);text-transform:uppercase}
.date.jogo{background:var(--gold-soft)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:12px 0 5px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;color:var(--ink)}
textarea.in{min-height:80px;resize:vertical}
.in:focus{outline:none;border-color:var(--gold)}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px var(--shadow);border-radius:22px 22px 0 0;z-index:5}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);font-weight:600;padding:4px 8px}
nav.bottom button span{font-size:21px;filter:grayscale(1);opacity:.6}
nav.bottom button.on{color:var(--navy)}
nav.bottom button.on span{filter:none;opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(27,42,74,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:21px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-size:14px;color:var(--ink)}
.opts button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.opts.emo button{font-size:24px;padding:6px 10px}
.bar{height:8px;background:var(--navy-soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.bar.mint i{background:var(--mint)}
.empty{text-align:center;color:var(--soft);font-size:14px;padding:14px 4px}
.msg{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.msg.me{background:var(--navy-soft);border-color:transparent}
.msg .who{font-size:12px;font-weight:600;color:var(--soft);margin-bottom:3px}
.tip{border-left:4px solid var(--gold);padding-left:12px;margin:12px 0}
.tip b{display:block;margin-bottom:3px}
.login{padding:calc(40px + env(safe-area-inset-top,0px)) 22px 30px}
.logo{width:64px;height:64px;border-radius:20px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:32px;margin-bottom:14px}
.code{font-family:'Baloo 2';font-size:30px;letter-spacing:4px;color:var(--navy);background:var(--gold-soft);border-radius:14px;padding:6px 14px;display:inline-block}
.obs{border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff;border:1px solid var(--line)}
.obs.melhorar{border-left:4px solid var(--gold)}
.obs.positivo{border-left:4px solid var(--mint)}
.obs.done{opacity:.55}
.spark{display:block;width:100%;height:70px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--navy-soft);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-family:'Baloo 2';font-size:22px;line-height:1.1}
.kpi small{font-size:11px;color:var(--soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--navy)}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
</div>
<div id="sheetHost"></div>

<script>
const SUPABASE_URL='https://hspekqrhttxeckghtryi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzcGVrcXJodHR4ZWNrZ2h0cnlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTc2OTQsImV4cCI6MjEwMzgzMzY5NH0.2MKWYnUYWbxJqogSzpsfbkVHD_J0QqqMse-duNtj_GI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ---------- dados fixos ---------- */
const COMPETENCIAS=['Passe','Receção','Condução','Remate','1x1 / Drible','Pé não dominante','Posicionamento','Defesa / Marcação','Transição','Guarda-redes','Atitude','Espírito de equipa','Concentração'];
const NIVEIS=['','A começar','Em progresso','Já consegue','Domina'];
const EMOCOES=[['😀','Contente'],['🤩','Orgulhoso'],['😐','Normal'],['😴','Cansado'],['😤','Frustrado'],['😢','Triste']];
const RECONHECIMENTOS=['💪 Maior esforço','🤝 Melhor colega','📈 Maior evolução','🟢 Fair-play','🦁 Coragem','🧠 Concentração'];
const DISCIPLINAS=['Português','Matemática','Inglês','Estudo do Meio','Ciências Naturais','História','Geografia','Físico-Química','Francês','Espanhol','Educação Física','Educação Visual','Educação Tecnológica','Música','TIC','Cidadania','Filosofia','Biologia e Geologia'];
const PERIODOS=['1.º Período','2.º Período','3.º Período','1.º Semestre','2.º Semestre','Teste'];
const ESCALAS={'1-5':{min:1,max:5,nome:'Nível 1 a 5 (2.º e 3.º ciclo)'},'0-20':{min:0,max:20,nome:'0 a 20 (secundário)'},'IS-MB':{min:1,max:4,nome:'Insuficiente a Muito Bom (1.º ciclo)'}};
const MB_LABELS=['','Insuficiente','Suficiente','Bom','Muito Bom'];
const CONTEXTOS={jogo:'⚽ Jogo',treino:'🏃 Treino',escola:'📚 Escola',casa:'🏠 Casa'};
const LEVAR_PADRAO='Equipamento completo, caneleiras, sapatilhas de pavilhão, garrafa de água, toalha e muda de roupa';
const DESAFIOS_PADRAO=[
  {titulo:'50 toques de sola',descricao:'Alternar a sola do pé direito e do esquerdo em cima da bola, sem a perder. Contar até 50.',minutos:5,pontos:10},
  {titulo:'Passe à parede com o pé fraco',descricao:'A 3 metros de uma parede, 30 passes só com o pé não dominante, a controlar a bola sempre.',minutos:10,pontos:15},
  {titulo:'Slalom com garrafas',descricao:'Pôr 6 garrafas em linha e conduzir a bola entre elas, ida e volta, 5 vezes. Usar os dois pés.',minutos:10,pontos:15},
  {titulo:'Equilíbrio de campeão',descricao:'Ficar 30 segundos num só pé, de olhos fechados. 3 vezes em cada pé.',minutos:5,pontos:10}
];

/* ---------- estado ---------- */
const S={me:null,perfil:null,equipas:[],eq:null,jogadores:[],meus:[],eventos:[],avisos:[],desafios:[],perfis:{},tab:'inicio',jog:null,jogTab:'resumo',msgTab:'avisos',temas:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const g=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const hoje=()=>new Date().toISOString().slice(0,10);
const addDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dataCurta=d=>{const x=new Date(d+'T12:00');return x.getDate()+' '+MESES[x.getMonth()]};
const diaSemana=d=>DIAS[new Date(d+'T12:00').getDay()];
const iniciais=n=>String(n||'?').trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
const primeiro=n=>String(n||'').split(' ')[0];
const isCoach=()=>S.eq && S.eq.treinador_id===S.me;
const nomeDe=uid=>S.perfis[uid]?.nome||'Alguém';
const anoLetivoAtual=()=>{const d=new Date();const y=d.getFullYear();return d.getMonth()>=8?`${y}/${String(y+1).slice(2)}`:`${y-1}/${String(y).slice(2)}`};

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
async function q(p,erro){const {data,error}=await p;if(error){console.error(error);toast(erro||('Erro: '+error.message));return null}return data??[]}

/* ---------- folha (janela de baixo) ---------- */
function openSheet(html){
  $('#sheetHost').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
}
function closeSheet(){$('#sheetHost').innerHTML=''}

/* ---------- entrada ---------- */
function ecraLogin(modo='entrar'){
  $('#screen').innerHTML=`<div class="login">
    <div class="logo">⚽</div>
    <h1 style="font-size:30px">Futsal 3S</h1>
    <p class="muted" style="margin:4px 0 22px">Treinador e pais lado a lado: agenda, presenças, boleias, evolução no desporto e na escola.</p>
    <div class="card">
      <div class="seg" style="margin-bottom:4px"><button class="${modo==='entrar'?'on':''}" onclick="ecraLogin('entrar')">Entrar</button><button class="${modo==='criar'?'on':''}" onclick="ecraLogin('criar')">Criar conta</button></div>
      <label class="f" for="lEmail">Email</label><input id="lEmail" class="in" type="email" autocomplete="email">
      <label class="f" for="lPass">Palavra-passe</label><input id="lPass" class="in" type="password" autocomplete="${modo==='criar'?'new-password':'current-password'}">
      ${modo==='criar'?'<p class="faint" style="margin:6px 0 0">Mínimo 6 caracteres.</p>':''}
      <button class="btn full" style="margin-top:16px" onclick="${modo==='criar'?'criarConta()':'entrar()'}">${modo==='criar'?'Criar conta':'Entrar'}</button>
      ${modo==='entrar'?'<button class="btn ghost full sm" style="margin-top:10px" onclick="recuperar()">Esqueci-me da palavra-passe</button>':''}
      <p id="lMsg" class="muted" style="margin:12px 0 0"></p>
    </div>
    <p class="faint" style="text-align:center">Uma app da Escola 3S · Saber, Sentir, Ser</p>
  </div>`;
}
async function entrar(){
  const {data,error}=await sb.auth.signInWithPassword({email:g('lEmail'),password:$('#lPass').value});
  if(error){$('#lMsg').textContent='Email ou palavra-passe errados.';return}
  await depoisLogin(data.user);
}
async function criarConta(){
  const email=g('lEmail'),pass=$('#lPass').value;
  if(!email||pass.length<6){$('#lMsg').textContent='Preencha o email e uma palavra-passe com 6 ou mais caracteres.';return}
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){$('#lMsg').textContent=error.message.includes('registered')?'Este email já tem conta. Toque em «Entrar».':'Não foi possível criar a conta: '+error.message;return}
  if(!data.session){$('#lMsg').innerHTML='<b>Conta criada.</b> Abra o email que lhe enviámos e confirme a conta. Depois volte aqui e toque em «Entrar».';return}
  await depoisLogin(data.user);
}
async function recuperar(){
  const email=g('lEmail');if(!email){$('#lMsg').textContent='Escreva primeiro o seu email.';return}
  await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  $('#lMsg').textContent='Enviámos um email com o link para criar uma nova palavra-passe.';
}
function novaPass(){
  openSheet(`<h2>Nova palavra-passe</h2><label class="f" for="np">Nova palavra-passe</label><input id="np" class="in" type="password" autocomplete="new-password">
  <button class="btn full" style="margin-top:14px" onclick="guardarPass()">Guardar</button>`);
}
async function guardarPass(){const p=$('#np').value;if(p.length<6){toast('Mínimo 6 caracteres');return}
  const {error}=await sb.auth.updateUser({password:p});if(error){toast(error.message);return}closeSheet();toast('Palavra-passe alterada')}
async function sair(){await sb.auth.signOut();location.reload()}

async function depoisLogin(user){
  S.me=user.id;
  const p=await q(sb.from('fut_perfis').select('*').eq('user_id',S.me).maybeSingle());
  if(!p){ecraPerfil();return}
  S.perfil=p; S.perfis[S.me]=p;
  await carregarEquipas();
}

/* ---------- configuração inicial ---------- */
function ecraPerfil(papel){
  $('#screen').innerHTML=`<div class="login">
    <div class="logo">👋</div><h1>Bem-vindo(a)!</h1>
    <p class="muted" style="margin:4px 0 18px">Só precisamos de duas coisas.</p>
    <div class="card">
      <label class="f" for="pNome">O seu nome</label><input id="pNome" class="in" autocomplete="name">
      <label class="f">Quem é?</label>
      <div class="opts"><button id="papT" class="${papel==='treinador'?'on':''}" onclick="ecraPerfilPapel('treinador')">🧢 Sou treinador(a)</button><button id="papP" class="${papel==='pai'?'on':''}" onclick="ecraPerfilPapel('pai')">👨‍👩‍👦 Sou pai / mãe</button></div>
      <label class="f" for="pTel">Telemóvel (opcional)</label><input id="pTel" class="in" type="tel" autocomplete="tel">
      <p class="faint" style="margin:5px 0 0">Só aparece aos pais da equipa quando oferece ou pede boleia.</p>
      <button class="btn full" style="margin-top:16px" onclick="guardarPerfil()">Continuar</button>
    </div></div>`;
  S._papel=papel;
}
function ecraPerfilPapel(p){const n=g('pNome'),t=g('pTel');ecraPerfil(p);$('#pNome').value=n;$('#pTel').value=t}
async function guardarPerfil(){
  const nome=g('pNome');if(!nome){toast('Escreva o seu nome');return}
  if(!S._papel){toast('Escolha se é treinador ou pai/mãe');return}
  const r=await q(sb.from('fut_perfis').insert({user_id:S.me,nome,papel:S._papel,telefone:g('pTel')||null}).select().single());
  if(!r)return; S.perfil=r; S.perfis[S.me]=r;
  await carregarEquipas();
}
function ecraSemEquipa(){
  const t=S.perfil.papel==='treinador';
  $('#screen').innerHTML=`<div class="login">
    <div class="logo">${t?'🧢':'🔑'}</div>
    <h1>${t?'Crie a sua equipa':'Entre na equipa'}</h1>
    <p class="muted" style="margin:4px 0 18px">${t?'Depois recebe um código para enviar aos pais.':'Peça ao treinador o código da equipa, ou use o código de família que outro pai/mãe lhe deu.'}</p>
    ${t?`<div class="card">
      <label class="f" for="eNome">Nome da equipa</label><input id="eNome" class="in" placeholder="Ex.: Futsal Portuzelo">
      <label class="f" for="eEsc">Escalão</label>
      <select id="eEsc" class="in"><option>Petizes (sub-7)</option><option>Traquinas (sub-9)</option><option>Benjamins (sub-11)</option><option>Infantis (sub-13)</option><option>Iniciados (sub-15)</option><option>Juvenis (sub-17)</option><option>Juniores (sub-19)</option></select>
      <button class="btn full" style="margin-top:16px" onclick="criarEquipa()">Criar equipa</button></div>`
    :`<div class="card"><h3>Código da equipa</h3><input id="cEq" class="in" placeholder="Ex.: 4F9A2C" style="text-transform:uppercase">
      <button class="btn full" style="margin-top:12px" onclick="entrarEquipa()">Entrar na equipa</button></div>
      <div class="card"><h3>Ou código de família</h3><p class="muted" style="margin:0 0 8px">Se o outro pai/mãe já registou o seu filho.</p><input id="cFam" class="in" style="text-transform:uppercase">
      <button class="btn ghost full" style="margin-top:12px" onclick="juntarFilho()">Ligar ao meu filho</button></div>`}
    <button class="btn ghost sm" onclick="sair()">Sair</button></div>`;
}
async function criarEquipa(){
  const nome=g('eNome');if(!nome){toast('Escreva o nome da equipa');return}
  const e=await q(sb.from('fut_equipas').insert({nome,escalao:g('eEsc'),treinador_id:S.me}).select().single());if(!e)return;
  await q(sb.from('fut_desafios').insert(DESAFIOS_PADRAO.map(d=>({...d,equipa_id:e.id}))));
  try{localStorage.setItem('fut_eq',e.id)}catch(_){}
  await carregarEquipas();
  mostrarCodigoEquipa();
}
async function entrarEquipa(){
  const c=g('cEq');if(!c){toast('Escreva o código');return}
  const {data,error}=await sb.rpc('fut_entrar_equipa',{p_codigo:c});
  if(error){toast('Código de equipa inválido');return}

async function juntarFilho(cod){

/* ---------- carregar dados ---------- */
async function carregarEquipas(){
  S.equipas=await q(sb.from('fut_equipas').select('*').order('created_at'))||[];
  if(!S.equipas.length){ecraSemEquipa();return}
  let guardada=null;try{guardada=localStorage.getItem('fut_eq')}catch(_){}
  S.eq=S.equipas.find(e=>e.id===guardada)||S.equipas[0];
  await carregar(); render();
}
async function carregar(){
  const eq=S.eq.id;
  const [jog,fam,evs,av,des,mem]=await Promise.all([
    q(sb.from('fut_jogadores').select('id,equipa_id,nome,numero,posicao,ano_escolar,autoriza_fotos').eq('equipa_id',eq).order('nome')),
    q(sb.from('fut_familia').select('jogador_id,user_id')),
    q(sb.from('fut_eventos').select('*').eq('equipa_id',eq).gte('data',addDias(-60)).order('data').order('hora')),
    q(sb.from('fut_mensagens').select('*').eq('equipa_id',eq).is('jogador_id',null).order('created_at',{ascending:false}).limit(50)),
    q(sb.from('fut_desafios').select('*').eq('equipa_id',eq).eq('ativo',true).order('created_at')),
    q(sb.from('fut_membros').select('user_id').eq('equipa_id',eq))
  ]);
  S.jogadores=jog||[];S.familia=fam||[];S.eventos=evs||[];S.avisos=av||[];S.desafios=des||[];
  const minhas=new Set((fam||[]).filter(f=>f.user_id===S.me).map(f=>f.jogador_id));
  S.meus=isCoach()?S.jogadores:S.jogadores.filter(j=>minhas.has(j.id));
  const ids=[...new Set([S.eq.treinador_id,...(mem||[]).map(m=>m.user_id),...(fam||[]).map(f=>f.user_id)])];
  if(ids.length){const ps=await q(sb.from('fut_perfis').select('user_id,nome,papel,telefone').in('user_id',ids));(ps||[]).forEach(p=>S.perfis[p.user_id]=p)}
  // presenças dos próximos eventos (pais: só dos filhos)
  const prox=S.eventos.filter(e=>e.data>=addDias(-1)).map(e=>e.id);
  S.presencas=prox.length?(await q(sb.from('fut_presencas').select('*').in('evento_id',prox))||[]):[];
  if(!isCoach()&&S.meus.length){
    S.alertas=[];
  } else if(isCoach()&&S.jogadores.length){
    const em=await q(sb.from('fut_emocoes').select('*').in('jogador_id',S.jogadores.map(j=>j.id)).gte('created_at',addDias(-10)).order('created_at',{ascending:false}));
    S.alertas=(em||[]).filter(e=>['Frustrado','Triste'].includes(e.emocao));
  }
}

function linhaResposta(ev,j){
  const r=respostaDe(ev.id,j.id);const v=r?.resposta;
  return `<div style="margin-top:12px"><div class="row between"><b style="font-size:14px">${esc(primeiro(j.nome))}</b>${r?.convocado?'<span class="chip mint">Convocado</span>':''}</div>
  <div class="opts" style="margin-top:6px">${[['vai','✅ Vai'],['talvez','🤔 Talvez'],['nao_vai','❌ Não vai']].map(([k,l])=>`<button class="${v===k?'on':''}" onclick="responder('${ev.id}','${j.id}','${k}')">${l}</button>`).join('')}</div></div>`;
}
function resumoRespostas(ev){
  const ps=S.presencas.filter(p=>p.evento_id===ev.id);
  const c=k=>ps.filter(p=>p.resposta===k).length;
  const sem=S.jogadores.length-ps.filter(p=>p.resposta).length;
  return `<div class="row wrap" style="margin-top:12px;gap:6px"><span class="chip mint">✅ ${c('vai')} vão</span><span class="chip gold">🤔 ${c('talvez')}</span><span class="chip red">❌ ${c('nao_vai')}</span><span class="chip">⏳ ${Math.max(0,sem)} sem resposta</span></div>`;
}
async function responder(ev,j,r){
  const {error}=await sb.rpc('fut_responder',{p_evento:ev,p_jogador:j,p_resposta:r});
  if(error){toast('Não foi possível guardar');return}
  const p=respostaDe(ev,j);if(p)p.resposta=r;else S.presencas.push({evento_id:ev,jogador_id:j,resposta:r});
  toast(r==='vai'?'Presença confirmada':'Resposta guardada'); if(S.tab==='inicio')vInicio(); else if($('.sheet'))abrirEvento(ev);
}
async function feitoDesafio(d,j){

  toast(error?(error.code==='23505'?'Já estava registado hoje':'Não foi possível registar'):'Boa! Desafio registado 🎉');
}

async function guardarEvento(id){
  const tipo=g('evTipo');
  const r={equipa_id:S.eq.id,tipo,data:g('evData'),hora:g('evHora'),hora_chegada:g('evCheg')||null,local:g('evLocal')||null,adversario:tipo==='jogo'?g('evAdv')||null:null,levar:g('evLevar')||null,notas:g('evNotas')||null};
  if(!r.data){toast('Escolha o dia');return}
  if(id){await q(sb.from('fut_eventos').update(r).eq('id',id))}
  else{
    const rows=[r];
    if($('#evRep')?.checked){for(let i=1;i<8;i++){const d=new Date(r.data+'T12:00');d.setDate(d.getDate()+7*i);rows.push({...r,data:d.toISOString().slice(0,10)})}}
    await q(sb.from('fut_eventos').insert(rows));
  }
  closeSheet();await carregar();render();toast('Agenda atualizada');
}
async function apagarEvento(id){
  openSheet(`<h2>Desmarcar?</h2><p class="muted">As respostas e boleias deste evento também são apagadas.</p><button class="btn red full" onclick="apagarEventoOk('${id}')">Sim, desmarcar</button><button class="btn ghost full" style="margin-top:8px" onclick="closeSheet()">Voltar</button>`);

async function apagarEventoOk(id){await q(sb.from('fut_eventos').delete().eq('id',id));closeSheet();await carregar();render();toast('Desmarcado')}

  ${e.notas?`<div class="card" style="margin:10px 0"><b>Notas</b><p style="margin:4px 0 0">${esc(e.notas)}</p></div>`:''}
  ${e.levar?`<div class="card" style="margin:10px 0"><b>🎒 O que levar</b><p style="margin:4px 0 0">${esc(e.levar)}</p></div>`:''}`;

function blocoTreinador(e){
  if(!S.jogadores.length) return `<div class="card" style="margin:10px 0"><p class="muted">Ainda não há jogadores na equipa.</p></div>`;
  const passado=e.data<=hoje();
  return `<div class="card" style="margin:10px 0"><b>${passado?'Registo dos jogadores':'Respostas e convocatória'}</b>
  <div class="list" style="margin-top:6px">${S.jogadores.map(j=>{const p=respostaDe(e.id,j.id)||{};
    const r={vai:'✅',talvez:'🤔',nao_vai:'❌'}[p.resposta]||'⏳';
    return `<div><div class="row between"><div class="grow"><b>${r} ${esc(j.nome)}</b>${p.minutos!=null?`<div class="faint">${p.minutos} min${p.esforco?' · esforço '+p.esforco+'/5':''}${p.atitude?' · atitude '+p.atitude+'/5':''}</div>`:''}</div>
      ${e.tipo==='jogo'&&!passado?`<button class="btn sm ${p.convocado?'gold':'ghost'}" onclick="convocar('${e.id}','${j.id}',${!p.convocado})">${p.convocado?'Convocado':'Convocar'}</button>`:''}
      ${passado?`<button class="btn ghost sm" onclick="registoJogador('${e.id}','${j.id}')">Registar</button>`:''}</div></div>`}).join('')}</div>
  ${passado&&e.tipo==='jogo'?`<button class="btn ghost full sm" style="margin-top:10px" onclick="resultadoJogo('${e.id}')">Resultado do jogo</button>`:''}</div>`;
}
async function convocar(ev,j,v){
  await q(sb.from('fut_presencas').upsert({evento_id:ev,jogador_id:j,convocado:v},{onConflict:'evento_id,jogador_id'}));
  const p=respostaDe(ev,j);if(p)p.convocado=v;else S.presencas.push({evento_id:ev,jogador_id:j,convocado:v});
  abrirEvento(ev);
}
let RJ={};
function registoJogador(ev,j){

}

/* escola */
const ordPer=p=>{const i=PERIODOS.indexOf(p);return i<0?9:i};
function ordenarNotas(ns){return [...ns].sort((a,b)=>a.ano_letivo===b.ano_letivo?(ordPer(a.periodo)-ordPer(b.periodo)||a.created_at.localeCompare(b.created_at)):a.ano_letivo.localeCompare(b.ano_letivo))}
function ultimasNotas(ns){
  const por={};ordenarNotas(ns).forEach(n=>{(por[n.disciplina]=por[n.disciplina]||[]).push(n)});
  return Object.entries(por).map(([d,arr])=>({disciplina:d,arr,ult:arr[arr.length-1],ant:arr[arr.length-2]}));
}
function pct(n){const e=ESCALAS[n.escala]||ESCALAS['1-5'];return (n.nota-e.min)/(e.max-e.min)}
function fmtNota(n){return n.escala==='IS-MB'?MB_LABELS[n.nota]||n.nota:(Number(n.nota)%1?Number(n.nota).toFixed(1):n.nota)}
function setaTend(u){if(!u.ant)return '';const d=pct(u.ult)-pct(u.ant);return d>0.001?'<span style="color:var(--mint)">▲</span>':d<-0.001?'<span style="color:var(--red)">▼</span>':'<span class="faint">=</span>'}
function spark(arr){
  const W=300,H=70,P=10;const n=arr.length;
  const pts=arr.map((x,i)=>[n===1?W/2:P+i*(W-2*P)/(n-1),H-P-pct(x)*(H-2*P)]);
  const positiva={'1-5':3,'0-20':10,'IS-MB':2}[arr[0].escala]??3;
  const yMeio=H-P-pct({nota:positiva,escala:arr[0].escala})*(H-2*P);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução da nota">
    <line x1="${P}" x2="${W-P}" y1="${yMeio}" y2="${yMeio}" stroke="var(--line)" stroke-dasharray="4 4"/>

}

function linhasNotas(){
  const e=g('nEsc');
  const campo=d=>e==='IS-MB'?`<select class="in" data-d="${esc(d)}" style="width:150px"><option value=""></option>${MB_LABELS.slice(1).map((l,i)=>`<option value="${i+1}">${l}</option>`).join('')}</select>`

async function guardarNotas(){
  const esc_=g('nEsc'),lim=ESCALAS[esc_];const rows=[];let erro=false;
  const add=(d,v)=>{v=String(v).replace(',','.').trim();if(!v)return;const n=parseFloat(v);if(isNaN(n)||n<lim.min||n>lim.max){erro=d;return}rows.push({jogador_id:S.jog,ano_letivo:g('nAno'),periodo:g('nPer'),disciplina:d,nota:n,escala:esc_,autor_id:S.me})};
  document.querySelectorAll('#nLinhas [data-d]').forEach(i=>add(i.dataset.d,i.value));
  if(g('nOutra'))add(g('nOutra'),g('nOutraV'));
  if(erro){toast(`Nota inválida em ${erro} (${lim.min} a ${lim.max})`);return}
  if(!rows.length){toast('Escreva pelo menos uma nota');return}
  const r=await q(sb.from('fut_notas_escola').upsert(rows,{onConflict:'jogador_id,ano_letivo,periodo,disciplina'}));if(r===null)return;
  closeSheet();vJogador();toast(`${rows.length} nota(s) guardada(s)`);
}

/* evolução (competências) */
function resumoComp(av){const por={};[...av].sort((a,b)=>a.data.localeCompare(b.data)).forEach(a=>{(por[a.competencia]=por[a.competencia]||[]).push(a)});
  return Object.entries(por).map(([c,arr])=>({competencia:c,nivel:arr[arr.length-1].nivel,ant:arr.length>1?arr[arr.length-2].nivel:null,hist:arr}))}
async function jEvolucao(j){
  const [av,pres]=await Promise.all([q(sb.from('fut_avaliacoes').select('*').eq('jogador_id',j.id)),q(sb.from('fut_presencas').select('*').eq('jogador_id',j.id))]);
  const comp=resumoComp(av||[]);
  const regs=(pres||[]).map(p=>({...p,ev:S.eventos.find(e=>e.id===p.evento_id)})).filter(p=>p.ev&&(p.esforco||p.atitude||p.minutos!=null)).sort((a,b)=>b.ev.data.localeCompare(a.ev.data));
  return `${isCoach()?'<div class="card"><button class="btn gold full" onclick="avaliar()">+ Avaliar competências</button></div>':''}
  <div class="card"><h3>Competências</h3><p class="faint" style="margin-top:0">1 A começar · 2 Em progresso · 3 Já consegue · 4 Domina</p>
  ${comp.length?comp.map(c=>`<div style="margin:10px 0"><div class="row between"><span>${esc(c.competencia)} ${c.ant&&c.nivel>c.ant?'<span style="color:var(--mint)">▲</span>':''}</span><span class="faint">${NIVEIS[c.nivel]}</span></div><div class="bar"><i style="width:${c.nivel*25}%"></i></div></div>`).join(''):'<p class="empty">Ainda sem avaliações.</p>'}</div>
  <div class="card"><h3>Treinos e jogos</h3>${regs.length?`<div class="list">${regs.slice(0,15).map(r=>`<div><div class="row between"><b style="font-size:14px">${r.ev.tipo==='jogo'?'⚽ vs '+esc(r.ev.adversario||''):'🏃 Treino'}</b><span class="faint">${dataCurta(r.ev.data)}</span></div><div class="muted">${r.minutos!=null?r.minutos+' min · ':''}${r.esforco?'esforço '+r.esforco+'/5 · ':''}${r.atitude?'atitude '+r.atitude+'/5':''}${r.competencia?' · trabalhou '+esc(r.competencia):''}</div></div>`).join('')}</div>`:'<p class="empty">O treinador ainda não registou nada.</p>'}</div>`;
}

async function vMensagens(){
  const m=$('#main');
  const tabs=`<div class="seg"><button class="${S.msgTab==='avisos'?'on':''}" onclick="S.msgTab='avisos';vMensagens()">📢 Avisos da equipa</button><button class="${S.msgTab==='privadas'?'on':''}" onclick="S.msgTab='privadas';vMensagens()">🔒 Conversas privadas</button></div>`;
  if(S.msgTab==='avisos'){
    m.innerHTML=tabs+`${isCoach()?`<div class="card"><textarea id="avTxt" class="in" placeholder="Aviso para todos os pais…"></textarea><button class="btn full" style="margin-top:8px" onclick="enviarAviso()">Enviar aviso</button></div>`:''}
    <div class="card">${S.avisos.length?S.avisos.map(a=>`<div class="msg"><div class="row between"><div class="who">${esc(nomeDe(a.autor_id))} · ${dataCurta(a.created_at.slice(0,10))}</div>${a.autor_id===S.me?`<button class="btn red sm" onclick="apagarAviso('${a.id}')">✕</button>`:''}</div>${esc(a.texto)}</div>`).join(''):'<p class="empty">Sem avisos.</p>'}</div>`;
  } else {
    const ids=S.meus.map(j=>j.id);
    let ult={};
    if(ids.length){const ms=await q(sb.from('fut_mensagens').select('jogador_id,texto,created_at,autor_id').in('jogador_id',ids).order('created_at',{ascending:false}).limit(200));(ms||[]).forEach(x=>{if(!ult[x.jogador_id])ult[x.jogador_id]=x})}
    const lista=[...S.meus].sort((a,b)=>(ult[b.id]?.created_at||'').localeCompare(ult[a.id]?.created_at||''));
    m.innerHTML=tabs+`<div class="card">${lista.length?`<div class="list">${lista.map(j=>`<button class="item" onclick="abrirJogador('${j.id}','conversa')"><div class="av navy">${iniciais(j.nome)}</div><div class="grow"><b>${esc(j.nome)}</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ult[j.id]?esc(primeiro(nomeDe(ult[j.id].autor_id)))+': '+esc(ult[j.id].texto):'Sem mensagens'}</div></div></button>`).join('')}</div>`:'<p class="empty">Sem conversas.</p>'}</div>`;
  }
}
async function enviarAviso(){const t=g('avTxt');if(!t)return;await q(sb.from('fut_mensagens').insert({equipa_id:S.eq.id,autor_id:S.me,texto:t}));await carregar();vMensagens();toast('Aviso enviado')}
async function apagarAviso(id){await q(sb.from('fut_mensagens').delete().eq('id',id));await carregar();vMensagens()}

  <div class="card"><h2>🎒 Mochila do jogo</h2>${['Equipamento completo','Caneleiras','Sapatilhas de pavilhão','Garrafa de água','Toalha e muda de roupa','Lanche para depois'].map(x=>`<label class="check"><input type="checkbox"> ${x}</label>`).join('')}</div>`;

/* ---------- conta ---------- */
function abrirConta(){
  openSheet(`<h2>${esc(S.perfil.nome)}</h2><p class="muted">${isCoach()?'Treinador(a)':'Pai / Mãe'}</p>
  ${S.equipas.length>1?`<label class="f">Equipa</label><select id="cEqSel" class="in" onchange="mudarEquipa(this.value)">${S.equipas.map(e=>`<option value="${e.id}" ${e.id===S.eq.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>`:''}
  ${isCoach()?`<div class="card" style="margin-top:14px"><b>Código da equipa</b><p class="muted" style="margin:4px 0 8px">Os pais usam-no para entrar.</p><span class="code">${esc(S.eq.codigo)}</span></div>`:''}
  <label class="f" for="cNome">Nome</label><input id="cNome" class="in" value="${esc(S.perfil.nome)}">
  <label class="f" for="cTel">Telemóvel (para boleias)</label><input id="cTel" class="in" type="tel" value="${esc(S.perfil.telefone||'')}">
  <button class="btn full" style="margin-top:12px" onclick="guardarConta()">Guardar</button>
  ${isCoach()?`<button class="btn ghost full" style="margin-top:8px" onclick="closeSheet();S.perfil.papel='treinador';ecraSemEquipa()">+ Criar outra equipa</button>`:`<button class="btn ghost full" style="margin-top:8px" onclick="closeSheet();ecraSemEquipa()">+ Entrar noutra equipa</button>`}
  <button class="btn ghost full" style="margin-top:8px" onclick="novaPass()">Mudar palavra-passe</button>
  <button class="btn red full" style="margin-top:8px" onclick="sair()">Sair</button>`)}
async function guardarConta(){const r={nome:g('cNome')||S.perfil.nome,telefone:g('cTel')||null};await q(sb.from('fut_perfis').update(r).eq('user_id',S.me));Object.assign(S.perfil,r);closeSheet();render();toast('Guardado')}
async function mudarEquipa(id){try{localStorage.setItem('fut_eq',id)}catch(_){}S.eq=S.equipas.find(e=>e.id===id);S.jog=null;closeSheet();await carregar();render()}

/* ---------- arranque ---------- */
(async()=>{
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(novaPass,300)});
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) await depoisLogin(session.user); else ecraLogin();
})();
</script>
