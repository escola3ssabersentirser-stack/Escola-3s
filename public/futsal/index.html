<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Futsal 3S">
<meta name="theme-color" content="#1B2A4A">
<title>Futsal 3S</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" href="futsal-favicon.png">
<link rel="apple-touch-icon" href="futsal-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F6EEE4; --card:#FFFDF9; --ink:#1B2A4A; --soft:#5E6782; --faint:#A3A9BA;
  --navy:#1B2A4A; --navy-soft:#E7EAF1; --gold:#B3843F; --gold-soft:#F2E5D1;
  --mint:#4F8466; --mint-soft:#E2EDE5; --red:#B5483E; --red-soft:#F6DEDA;
  --line:#E8DDCF; --shadow:rgba(27,42,74,.08); --r:20px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
h1,h2,h3{font-family:'Baloo 2','Inter',sans-serif;font-weight:600;margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
[hidden]{display:none!important}
#app{width:100%;max-width:460px;min-height:100%;display:flex;flex-direction:column;position:relative}
header.top{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 44px;background:var(--navy);color:#fff;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
header.top::after{content:'';position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;border:1.5px solid var(--gold);opacity:.6}
header.top .sub{font-size:13px;opacity:.75;margin-bottom:2px}
header.top h1{font-size:24px;color:#fff}
header.top .team{display:inline-flex;gap:6px;align-items:center;margin-top:8px;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:99px;font-size:12px;border:0;color:#fff}
main{flex:1;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px));margin-top:-26px;position:relative;z-index:1}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 6px 20px var(--shadow);margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:8px}
.card h3{font-size:15px;margin-bottom:6px}
.muted{color:var(--soft);font-size:13px}
.faint{color:var(--faint);font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold)}
.btn.ghost{background:var(--navy-soft);color:var(--navy)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--navy-soft);color:var(--navy)}
.chip.gold{background:var(--gold-soft);color:#7d5a22}
.chip.mint{background:var(--mint-soft);color:var(--mint)}
.chip.red{background:var(--red-soft);color:var(--red)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;white-space:nowrap;padding:8px 13px;border-radius:99px;background:var(--card);color:var(--soft);font-weight:600;font-size:13px;box-shadow:0 2px 8px var(--shadow)}
.seg button.on{background:var(--navy);color:#fff}
.list>*{border-top:1px solid var(--line);padding:11px 0}
.list>*:first-child{border-top:0;padding-top:2px}
.item{display:flex;gap:12px;align-items:center;background:none;border:0;width:100%;text-align:left;color:inherit;padding:0}
.av{width:42px;height:42px;border-radius:14px;background:var(--gold-soft);color:#7d5a22;display:grid;place-items:center;font-weight:700;font-family:'Baloo 2';font-size:17px;flex:none}
.av.navy{background:var(--navy-soft);color:var(--navy)}
.date{width:46px;text-align:center;flex:none;background:var(--navy-soft);border-radius:12px;padding:5px 0;line-height:1.1}
.date b{display:block;font-family:'Baloo 2';font-size:19px}
.date small{font-size:11px;color:var(--soft);text-transform:uppercase}
.date.jogo{background:var(--gold-soft)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:12px 0 5px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;color:var(--ink)}
textarea.in{min-height:80px;resize:vertical}
.in:focus{outline:none;border-color:var(--gold)}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px var(--shadow);border-radius:22px 22px 0 0;z-index:5}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);font-weight:600;padding:4px 8px}
nav.bottom button span{font-size:21px;filter:grayscale(1);opacity:.6}
nav.bottom button.on{color:var(--navy)}
nav.bottom button.on span{filter:none;opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(27,42,74,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:21px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-size:14px;color:var(--ink)}
.opts button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.opts.emo button{font-size:24px;padding:6px 10px}
.bar{height:8px;background:var(--navy-soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.bar.mint i{background:var(--mint)}
.empty{text-align:center;color:var(--soft);font-size:14px;padding:14px 4px}
.msg{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.msg.me{background:var(--navy-soft);border-color:transparent}
.msg .who{font-size:12px;font-weight:600;color:var(--soft);margin-bottom:3px}
.tip{border-left:4px solid var(--gold);padding-left:12px;margin:12px 0}
.tip b{display:block;margin-bottom:3px}
.login{padding:calc(40px + env(safe-area-inset-top,0px)) 22px 30px}
.logo{width:64px;height:64px;border-radius:20px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:32px;margin-bottom:14px}
.code{font-family:'Baloo 2';font-size:30px;letter-spacing:4px;color:var(--navy);background:var(--gold-soft);border-radius:14px;padding:6px 14px;display:inline-block}
.obs{border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff;border:1px solid var(--line)}
.obs.melhorar{border-left:4px solid var(--gold)}
.obs.positivo{border-left:4px solid var(--mint)}
.obs.done{opacity:.55}
.spark{display:block;width:100%;height:70px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--navy-soft);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-family:'Baloo 2';font-size:22px;line-height:1.1}
.kpi small{font-size:11px;color:var(--soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--navy)}

/* cartões ao estilo do Gestor de Loja */
.h3s-card{background:var(--card);border-radius:24px;box-shadow:0 6px 22px var(--shadow);padding:20px}
.h3s-hero{text-align:center;cursor:pointer}
.h3s-hero-tit{font-size:18px;color:var(--ink);font-weight:600}
.h3s-hero-num{font-size:clamp(38px,11vw,58px);font-weight:800;color:var(--ink);line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em;font-family:'Baloo 2',sans-serif}
.h3s-hero-sub{font-size:15px;color:var(--soft)}
.h3s-hero-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.h3s-mini-tit{font-size:14px;color:var(--soft)}
.h3s-mini-num{font-size:28px;font-weight:800;margin-top:2px;font-family:'Baloo 2',sans-serif}
.h3s-mini-num.pos,.h3s-stat-num.pos{color:var(--mint)}.h3s-mini-num.neg,.h3s-tile-num.neg,.h3s-stat-num.neg{color:var(--red)}
.h3s-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;padding:14px 8px}
.h3s-stat{cursor:pointer;padding:6px 2px;border-radius:14px}.h3s-stat:active{background:var(--navy-soft)}
.h3s-stat-tit{font-size:13px;color:var(--soft);line-height:1.3;min-height:34px}
.h3s-stat-num{font-size:26px;font-weight:800;color:var(--ink);margin-top:4px;font-family:'Baloo 2',sans-serif}
.h3s-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}
.h3s-tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:10px 4px;min-height:96px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px var(--shadow);transition:transform .15s}
.h3s-tile:active{transform:scale(.97)}.h3s-tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.h3s-ic{font-size:20px;line-height:1}
.h3s-tile-tit{font-size:12px;color:var(--ink);margin-top:3px;line-height:1.2;font-weight:600}
.h3s-tile-num{font-size:18px;font-weight:800;color:var(--ink);word-break:break-word;font-family:'Baloo 2',sans-serif}
.h3s-tile-num.h3s-abrir{font-size:13px;font-weight:700;color:var(--gold);font-family:inherit}
.h3s-tile-sub{font-size:10.5px;color:var(--soft);font-weight:600}
.h3s-bloco-tit{font-size:15px;font-weight:700;color:var(--navy);margin:20px 4px 10px}
.h3s-pills{display:flex;flex-wrap:wrap;gap:10px}
.h3s-pill{border:none;cursor:pointer;background:var(--navy);color:#fff;font-size:15px;font-weight:700;padding:12px 22px;border-radius:999px;min-height:44px;font-family:inherit}
nav.bottom button{white-space:nowrap;min-width:0;letter-spacing:-.2px;padding:4px 4px!important}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
</div>
<div id="sheetHost"></div>

<script>
const SUPABASE_URL='https://hspekqrhttxeckghtryi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzcGVrcXJodHR4ZWNrZ2h0cnlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTc2OTQsImV4cCI6MjEwMzgzMzY5NH0.2MKWYnUYWbxJqogSzpsfbkVHD_J0QqqMse-duNtj_GI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ESCUDO=(w)=>`<svg width="${w}" height="${Math.round(w*1.3)}" viewBox="110 60 300 390" role="img" aria-label="Futsal 3S"><path d="M260 70 L400 118 V250 C400 338 342 398 260 440 C178 398 120 338 120 250 V118 Z" fill="#1B2A4A"/><path d="M260 92 L380 133 V250 C380 326 330 380 260 416 C190 380 140 326 140 250 V133 Z" fill="none" stroke="#C49A5A" stroke-width="5"/><g transform="translate(260 238)"><circle r="72" fill="#FFFDF9"/><polygon points="0,-27 25.7,-8.3 15.9,21.8 -15.9,21.8 -25.7,-8.3" fill="#1B2A4A"/><g stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"><line x1="0" y1="-27" x2="0" y2="-66"/><line x1="25.7" y1="-8.3" x2="62.7" y2="-20.4"/><line x1="15.9" y1="21.8" x2="38.8" y2="53.4"/><line x1="-15.9" y1="21.8" x2="-38.8" y2="53.4"/><line x1="-25.7" y1="-8.3" x2="-62.7" y2="-20.4"/></g></g><text x="260" y="366" text-anchor="middle" font-family="Baloo 2,Arial Black,sans-serif" font-weight="800" font-size="40" fill="#C49A5A">3S</text></svg>`;
/* ---------- dados fixos ---------- */
const COMPETENCIAS=['Passe','Receção','Condução','Remate','1x1 / Drible','Pé não dominante','Posicionamento','Defesa / Marcação','Transição','Guarda-redes','Atitude','Espírito de equipa','Concentração'];
const NIVEIS=['','A começar','Em progresso','Já consegue','Domina'];
const EMOCOES=[['😀','Contente'],['🤩','Orgulhoso'],['😐','Normal'],['😴','Cansado'],['😤','Frustrado'],['😢','Triste']];
const RECONHECIMENTOS=['💪 Maior esforço','🤝 Melhor colega','📈 Maior evolução','🟢 Fair-play','🦁 Coragem','🧠 Concentração'];
const DISCIPLINAS=['Português','Matemática','Inglês','Estudo do Meio','Ciências Naturais','História','Geografia','Físico-Química','Francês','Espanhol','Educação Física','Educação Visual','Educação Tecnológica','Música','TIC','Cidadania','Filosofia','Biologia e Geologia'];
const PERIODOS=['1.º Período','2.º Período','3.º Período','1.º Semestre','2.º Semestre','Teste'];
const ESCALAS={'1-5':{min:1,max:5,nome:'Nível 1 a 5 (2.º e 3.º ciclo)'},'0-20':{min:0,max:20,nome:'0 a 20 (secundário)'},'IS-MB':{min:1,max:4,nome:'Insuficiente a Muito Bom (1.º ciclo)'}};
const MB_LABELS=['','Insuficiente','Suficiente','Bom','Muito Bom'];
const CONTEXTOS={jogo:'⚽ Jogo',treino:'🏃 Treino',escola:'📚 Escola',casa:'🏠 Casa'};
const LEVAR_PADRAO='Equipamento completo, caneleiras, sapatilhas de pavilhão, garrafa de água, toalha e muda de roupa';
const DESAFIOS_PADRAO=[
  {titulo:'50 toques de sola',descricao:'Alternar a sola do pé direito e do esquerdo em cima da bola, sem a perder. Contar até 50.',minutos:5,pontos:10},
  {titulo:'Passe à parede com o pé fraco',descricao:'A 3 metros de uma parede, 30 passes só com o pé não dominante, a controlar a bola sempre.',minutos:10,pontos:15},
  {titulo:'Slalom com garrafas',descricao:'Pôr 6 garrafas em linha e conduzir a bola entre elas, ida e volta, 5 vezes. Usar os dois pés.',minutos:10,pontos:15},
  {titulo:'Equilíbrio de campeão',descricao:'Ficar 30 segundos num só pé, de olhos fechados. 3 vezes em cada pé.',minutos:5,pontos:10}
];

/* ---------- estado ---------- */
const S={me:null,perfil:null,equipas:[],eq:null,jogadores:[],meus:[],eventos:[],avisos:[],desafios:[],perfis:{},tab:'inicio',jog:null,jogTab:'resumo',msgTab:'avisos',temas:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const g=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const hoje=()=>new Date().toISOString().slice(0,10);
const addDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dataCurta=d=>{const x=new Date(d+'T12:00');return x.getDate()+' '+MESES[x.getMonth()]};
const diaSemana=d=>DIAS[new Date(d+'T12:00').getDay()];
const iniciais=n=>String(n||'?').trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
const primeiro=n=>String(n||'').split(' ')[0];
const modoVer=()=>S.admin?(S.modo==='familia'?'pai':(S.modo||'admin')):null;
const emPrevia=()=>S.admin&&['treinador','pai','atleta'].includes(modoVer());
const isCoach=()=>!!(S.eq && ((S.eq.treinador_id===S.me && !(S.admin&&['pai','atleta'].includes(modoVer()))) || (S.admin && ['admin','treinador'].includes(modoVer()))));
const ePais=()=>!isCoach()&&!isAtleta();
const podeEditar=()=>!isAtleta();
const isAdminModo=()=>!!(S.admin && modoVer()==='admin');
const horaEv=e=>(e.hora||'')+(e.hora_fim?'–'+e.hora_fim:'');
const isAtleta=()=>(S.admin&&modoVer()==='atleta')||(!S.admin&&!isCoach()&&S.perfil&&S.perfil.papel==='atleta');
const nomeDe=uid=>S.perfis[uid]?.nome||'Alguém';
const anoLetivoAtual=()=>{const d=new Date();const y=d.getFullYear();return d.getMonth()>=8?`${y}/${String(y+1).slice(2)}`:`${y-1}/${String(y).slice(2)}`};

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
async function q(p,erro){const {data,error}=await p;if(error){console.error(error);toast(erro||('Erro: '+error.message));return null}return data??[]}

/* ---------- folha (janela de baixo) ---------- */
function openSheet(html){
  $('#sheetHost').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
}
function closeSheet(){$('#sheetHost').innerHTML=''}

/* ---------- entrada ---------- */
function ecraLogin(modo='entrar'){
  $('#screen').innerHTML=`<div class="login">
    <div style="margin-bottom:12px">${ESCUDO(84)}</div>
    <h1 style="font-size:30px">Futsal <span style="color:var(--gold)">3S</span></h1>
    <p class="muted" style="margin:4px 0 22px">Treinador e pais lado a lado: agenda, presenças, boleias, evolução no desporto e na escola.</p>
    <div class="card">
      <div class="seg" style="margin-bottom:4px"><button class="${modo==='entrar'?'on':''}" onclick="ecraLogin('entrar')">Entrar</button><button class="${modo==='criar'?'on':''}" onclick="ecraLogin('criar')">Criar conta</button></div>
      <label class="f" for="lEmail">Email</label><input id="lEmail" class="in" type="email" autocomplete="email">
      <label class="f" for="lPass">Palavra-passe</label><input id="lPass" class="in" type="password" autocomplete="${modo==='criar'?'new-password':'current-password'}">
      ${modo==='criar'?'<p class="faint" style="margin:6px 0 0">Mínimo 6 caracteres.</p>':''}
      <button class="btn full" style="margin-top:16px" onclick="${modo==='criar'?'criarConta()':'entrar()'}">${modo==='criar'?'Criar conta':'Entrar'}</button>
      ${modo==='entrar'?'<button class="btn ghost full sm" style="margin-top:10px" onclick="recuperar()">Esqueci-me da palavra-passe</button>':''}
      <p id="lMsg" class="muted" style="margin:12px 0 0"></p>
    </div>
    <p class="faint" style="text-align:center">Uma app da Escola 3S · Saber, Sentir, Ser</p>
  </div>`;
}
async function entrar(){
  const {data,error}=await sb.auth.signInWithPassword({email:g('lEmail'),password:$('#lPass').value});
  if(error){$('#lMsg').textContent='Email ou palavra-passe errados.';return}
  localStorage.removeItem('fut_pin_err');
  if(!pinGet(data.user.id)&&!localStorage.getItem('fut_pin_skip'))pinCriar(data.user.id,()=>depoisLogin(data.user));else await depoisLogin(data.user);
}
async function criarConta(){
  const email=g('lEmail'),pass=$('#lPass').value;
  if(!email||pass.length<6){$('#lMsg').textContent='Preencha o email e uma palavra-passe com 6 ou mais caracteres.';return}
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});

}

/* ---------- carregar dados ---------- */
async function carregarEquipas(){
  const ad=await q(sb.from('fut_admins').select('user_id').eq('user_id',S.me));S.admin=!!(ad&&ad.length);
  try{S.modo=localStorage.getItem('fut_modo')||'admin';S.verJog=localStorage.getItem('fut_verjog')||null}catch(_){S.modo='admin'}
  S.equipas=await q(sb.from('fut_equipas').select('*').order('created_at'))||[];
  if(!S.equipas.length){ecraSemEquipa();return}
  let guardada=null;try{guardada=localStorage.getItem('fut_eq')}catch(_){}
  const minhaFam=await q(sb.from('fut_familia').select('jogador_id').eq('user_id',S.me))||[];
  S.todosMeus=minhaFam.length?(await q(sb.from('fut_jogadores').select('id,equipa_id,nome,numero,posicao,ano_escolar,autoriza_fotos').in('id',minhaFam.map(f=>f.jogador_id)).order('nome'))||[]):[];
  try{S.filhoSel=S.filhoSel||localStorage.getItem('fut_filho')}catch(_){}
  S.eq=S.equipas.find(e=>e.id===guardada)||S.equipas[0];
  await carregar(); render();
}
async function carregar(){
  const eq=S.eq.id;
  const [jog,fam,evs,av,des,mem]=await Promise.all([
    q(sb.from('fut_jogadores').select('id,equipa_id,nome,numero,posicao,ano_escolar,autoriza_fotos').eq('equipa_id',eq).order('nome')),
    q(sb.from('fut_familia').select('jogador_id,user_id')),
    q(sb.from('fut_eventos').select('*').eq('equipa_id',eq).gte('data',addDias(-60)).order('data').order('hora')),
    q(sb.from('fut_mensagens').select('*').eq('equipa_id',eq).is('jogador_id',null).order('created_at',{ascending:false}).limit(50)),
    q(sb.from('fut_desafios').select('*').eq('equipa_id',eq).eq('ativo',true).order('created_at')),
    q(sb.from('fut_membros').select('user_id').eq('equipa_id',eq))
  ]);
  S.jogadores=jog||[];S.familia=fam||[];S.eventos=evs||[];S.avisos=av||[];S.desafios=des||[];
  const minhas=new Set((fam||[]).filter(f=>f.user_id===S.me).map(f=>f.jogador_id));
  const verJ=S.admin&&['pai','atleta'].includes(modoVer())&&S.verJog?S.jogadores.find(j=>j.id===S.verJog):null;
  if(verJ){S.meus=[verJ];S.todosMeus=[verJ]}
  else if(isAtleta()&&S.admin){S.meus=S.jogadores.slice(0,1);S.todosMeus=S.meus}
  else if(isAtleta()){const at=await q(sb.from('fut_atletas').select('jogador_id').eq('user_id',S.me))||[];const ids=new Set(at.map(a=>a.jogador_id));S.meus=S.jogadores.filter(j=>ids.has(j.id))}
  else S.meus=isCoach()?S.jogadores:S.jogadores.filter(j=>minhas.has(j.id));
  const ids=[...new Set([S.eq.treinador_id,...(mem||[]).map(m=>m.user_id),...(fam||[]).map(f=>f.user_id)])];
  if(ids.length){const ps=await q(sb.from('fut_perfis').select('user_id,nome,papel,telefone').in('user_id',ids));(ps||[]).forEach(p=>S.perfis[p.user_id]=p)}
  await carregarReunioes();
  const idsM=S.meus.map(j=>j.id);
  S.av360=idsM.length?(await q(sb.from('fut_avaliacoes_360').select('jogador_id,respondente_tipo,autor_id').eq('trimestre',trimAtual()).in('jogador_id',idsM))||[]):[];
  S.exames=idsM.length?(await q(sb.from('fut_exames').select('jogador_id,data,valido_ate,resultado').in('jogador_id',idsM).order('data',{ascending:false}))||[]):[];
  S.pagPend=idsM.length?(await q(sb.from('fut_pagamentos').select('*').in('jogador_id',idsM).in('estado',['pendente','avisado']))||[]):[];
  S.pes={};if(!isAtleta()&&idsM.length){const fs=await q(sb.from('fut_fichas').select('jogador_id,pe_dominante').in('jogador_id',idsM))||[];fs.forEach(f=>{if(f.pe_dominante)S.pes[f.jogador_id]=f.pe_dominante})}
  await carregarFotos(S.jogadores.map(j=>j.id));
  // presenças dos próximos eventos (pais: só dos filhos)
  const prox=S.eventos.filter(e=>e.data>=addDias(-1)).map(e=>e.id);
  S.presencas=prox.length?(await q(sb.from('fut_presencas').select('*').in('evento_id',prox))||[]):[];
  if(!isCoach()&&S.meus.length){
    S.alertas=[];
  } else if(isCoach()&&S.jogadores.length){
    const em=await q(sb.from('fut_emocoes').select('*').in('jogador_id',S.jogadores.map(j=>j.id)).gte('created_at',addDias(-10)).order('created_at',{ascending:false}));
    S.alertas=(em||[]).filter(e=>['Frustrado','Triste'].includes(e.emocao));
  }
}

function linhaResposta(ev,j){
  const r=respostaDe(ev.id,j.id);const v=r?.resposta;
  return `<div style="margin-top:12px"><div class="row between"><b style="font-size:14px">${esc(primeiro(j.nome))}</b>${r?.convocado?'<span class="chip mint">Convocado</span>':''}</div>
  <div class="opts" style="margin-top:6px">${[['vai','✅ Vai'],['talvez','🤔 Talvez'],['nao_vai','❌ Não vai']].map(([k,l])=>`<button class="${v===k?'on':''}" onclick="responder('${ev.id}','${j.id}','${k}')">${l}</button>`).join('')}</div></div>`;
}
function resumoRespostas(ev){
  const ps=S.presencas.filter(p=>p.evento_id===ev.id);
  const c=k=>ps.filter(p=>p.resposta===k).length;
  const sem=S.jogadores.length-ps.filter(p=>p.resposta).length;
  return `<div class="row wrap" style="margin-top:12px;gap:6px"><span class="chip mint">✅ ${c('vai')} vão</span><span class="chip gold">🤔 ${c('talvez')}</span><span class="chip red">❌ ${c('nao_vai')}</span><span class="chip">⏳ ${Math.max(0,sem)} sem resposta</span></div>`;
}
async function responder(ev,j,r){
  const {error}=await sb.rpc('fut_responder',{p_evento:ev,p_jogador:j,p_resposta:r});
  if(error){toast('Não foi possível guardar');return}
  const p=respostaDe(ev,j);if(p)p.resposta=r;else S.presencas.push({evento_id:ev,jogador_id:j,resposta:r});
  toast(r==='vai'?'Presença confirmada':'Resposta guardada'); if(S.tab==='inicio')vInicio(); else if($('.sheet'))abrirEvento(ev);
}

async function guardarEvento(id){
  const tipo=g('evTipo');
  const r={equipa_id:S.eq.id,tipo,data:g('evData'),hora:g('evHora'),hora_fim:g('evFim')||null,hora_chegada:g('evCheg')||null,local:g('evLocal')||null,adversario:tipo==='jogo'?g('evAdv')||null:null,resultado:tipo==='jogo'?(g('evRes')||null):null,levar:g('evLevar')||null,notas:g('evNotas')||null};
  if(!r.data){toast('Escolha o dia');return}
  if(id){await q(sb.from('fut_eventos').update(r).eq('id',id))}
  else{
    const rows=[r];
    if($('#evRep')?.checked){for(let i=1;i<8;i++){const d=new Date(r.data+'T12:00');d.setDate(d.getDate()+7*i);rows.push({...r,data:d.toISOString().slice(0,10)})}}
    await q(sb.from('fut_eventos').insert(rows));
  }
  closeSheet();await carregar();render();toast('Agenda atualizada');
}

    evJ.length?q(sb.from('fut_presencas').select('*').eq('jogador_id',j.id).in('evento_id',evJ.map(e=>e.id))):[],
    q(sb.from('fut_observacoes').select('*').eq('jogador_id',j.id).eq('resolvido',false).order('created_at',{ascending:false}).limit(3)),
    q(sb.from('fut_reconhecimentos').select('*').eq('jogador_id',j.id).order('data',{ascending:false})),
    q(sb.from('fut_notas_escola').select('*').eq('jogador_id',j.id)),
    q(sb.from('fut_avaliacoes').select('*').eq('jogador_id',j.id))
  ]);
  const p=pres||[];const treinos=evJ.filter(e=>e.tipo==='treino').map(e=>e.id);

  ${(rec||[]).length?`<div class="card"><h3>🏅 Reconhecimentos</h3><div class="row wrap" style="gap:6px">${rec.slice(0,8).map(r=>`<span class="chip gold">${esc(r.tipo)} · ${dataCurta(r.data)}</span>`).join('')}</div></div>`:''}

  <div class="card"><div class="row between"><h3>⚽ Competências</h3><button class="btn ghost sm" onclick="S.jogTab='evolucao';vJogador()">Ver</button></div>${resumoComp(av||[]).slice(0,5).map(c=>`<div style="margin:6px 0"><div class="row between"><span style="font-size:14px">${esc(c.competencia)}</span><span class="faint">${NIVEIS[c.nivel]}</span></div><div class="bar"><i style="width:${c.nivel*25}%"></i></div></div>`).join('')||'<p class="muted">O treinador ainda não avaliou competências.</p>'}</div>`;

/* a melhorar: jogos, treinos, escola, casa */
async function jMelhorar(j){
  const obs=await q(sb.from('fut_observacoes').select('*').eq('jogador_id',j.id).order('created_at',{ascending:false}))||[];
  const filtro=S.obsFiltro||'todos';
  const lista=obs.filter(o=>filtro==='todos'||o.contexto===filtro);
  const pend=lista.filter(o=>!o.resolvido),feitos=lista.filter(o=>o.resolvido);
  const card=o=>{const ev=o.evento_id&&S.eventos.find(e=>e.id===o.evento_id);return `<div class="obs ${o.tipo} ${o.resolvido?'done':''}"><div class="row between"><span class="faint">${CONTEXTOS[o.contexto]}${ev?' · '+dataCurta(ev.data):''} · ${esc(nomeDe(o.autor_id))}</span><span class="chip ${o.tipo==='positivo'?'mint':'gold'}">${o.tipo==='positivo'?'👍 Correu bem':'🎯 A melhorar'}</span></div>
    <p style="margin:6px 0">${esc(o.texto)}</p>
    <div class="row">${o.tipo==='melhorar'?`<button class="btn ghost sm" onclick="resolverObs('${o.id}',${!o.resolvido})">${o.resolvido?'↩ Reabrir':'✔ Já melhorou'}</button>`:''}${o.autor_id===S.me?`<button class="btn red sm" onclick="apagarObs('${o.id}')">Apagar</button>`:''}</div></div>`};
  return `<div class="card"><p class="muted" style="margin-top:0">Pais e treinador escrevem aqui o que viram — nos jogos, nos treinos, na escola e em casa. Todos veem o mesmo e trabalham juntos.</p>
    <button class="btn gold full" onclick="novaObs()">+ Escrever observação</button></div>
    <div class="seg">${[['todos','Tudo'],...Object.entries(CONTEXTOS)].map(([k,l])=>`<button class="${filtro===k?'on':''}" onclick="S.obsFiltro='${k}';vJogador()">${l}</button>`).join('')}</div>
    <div class="card"><h3>Em curso</h3>${pend.length?pend.map(card).join(''):'<p class="empty">Nada por aqui.</p>'}</div>
    ${feitos.length?`<div class="card"><h3>✔ Já melhorou</h3>${feitos.map(card).join('')}</div>`:''}`;
}
function novaObs(){
  const ctx=isCoach()?'treino':'casa';
  openSheet(`<h2>Nova observação</h2>
  <label class="f">Onde?</label><select id="oCtx" class="in">${Object.entries(CONTEXTOS).map(([k,l])=>`<option value="${k}" ${k===ctx?'selected':''}>${l}</option>`).join('')}</select>
  <label class="f">Tipo</label><select id="oTipo" class="in"><option value="melhorar">🎯 Aspeto a melhorar</option><option value="positivo">👍 Algo que correu bem</option></select>
  <label class="f" for="oTxt">O que observou</label><textarea id="oTxt" class="in" placeholder="Ex.: fica nervoso quando falha um passe e deixa de pedir a bola"></textarea>
  <p class="faint">Descreva o comportamento, não a criança. «Desistiu depois do golo sofrido» ajuda mais do que «é preguiçoso».</p>
  <button class="btn full" style="margin-top:12px" onclick="guardarObs()">Guardar</button>`)}
async function guardarObs(){if(!g('oTxt')){toast('Escreva a observação');return}
  await q(sb.from('fut_observacoes').insert({jogador_id:S.jog,autor_id:S.me,contexto:g('oCtx'),tipo:g('oTipo'),texto:g('oTxt')}));closeSheet();vJogador();toast('Partilhado com a família e o treinador')}
async function resolverObs(id,v){await q(sb.from('fut_observacoes').update({resolvido:v}).eq('id',id));vJogador()}
async function apagarObs(id){await q(sb.from('fut_observacoes').delete().eq('id',id));vJogador()}

/* escola */
const ordPer=p=>{const i=PERIODOS.indexOf(p);return i<0?9:i};
function ordenarNotas(ns){return [...ns].sort((a,b)=>a.ano_letivo===b.ano_letivo?(ordPer(a.periodo)-ordPer(b.periodo)||a.created_at.localeCompare(b.created_at)):a.ano_letivo.localeCompare(b.ano_letivo))}
function ultimasNotas(ns){
  const por={};ordenarNotas(ns).forEach(n=>{(por[n.disciplina]=por[n.disciplina]||[]).push(n)});
  return Object.entries(por).map(([d,arr])=>({disciplina:d,arr,ult:arr[arr.length-1],ant:arr[arr.length-2]}));
}
function pct(n){const e=ESCALAS[n.escala]||ESCALAS['1-5'];return (n.nota-e.min)/(e.max-e.min)}
function fmtNota(n){return n.escala==='IS-MB'?MB_LABELS[n.nota]||n.nota:(Number(n.nota)%1?Number(n.nota).toFixed(1):n.nota)}
function setaTend(u){if(!u.ant)return '';const d=pct(u.ult)-pct(u.ant);return d>0.001?'<span style="color:var(--mint)">▲</span>':d<-0.001?'<span style="color:var(--red)">▼</span>':'<span class="faint">=</span>'}
function spark(arr){
  const W=300,H=70,P=10;const n=arr.length;
  const pts=arr.map((x,i)=>[n===1?W/2:P+i*(W-2*P)/(n-1),H-P-pct(x)*(H-2*P)]);
  const positiva={'1-5':3,'0-20':10,'IS-MB':2}[arr[0].escala]??3;
  const yMeio=H-P-pct({nota:positiva,escala:arr[0].escala})*(H-2*P);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução da nota">
    <line x1="${P}" x2="${W-P}" y1="${yMeio}" y2="${yMeio}" stroke="var(--line)" stroke-dasharray="4 4"/>
    ${n>1?`<polyline fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}" vector-effect="non-scaling-stroke"/>`:''}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${i===n-1?'var(--gold)':'var(--navy)'}" vector-effect="non-scaling-stroke"/>`).join('')}
  </svg>`;
}
async function jEscola(j){
  const ns=await q(sb.from('fut_notas_escola').select('*').eq('jogador_id',j.id))||[];
  const ult=ultimasNotas(ns);
  const subir=ult.filter(u=>u.ant&&pct(u.ult)>pct(u.ant)).length,descer=ult.filter(u=>u.ant&&pct(u.ult)<pct(u.ant)).length;
  const obsE=await q(sb.from('fut_observacoes').select('*').eq('jogador_id',j.id).eq('contexto','escola').eq('resolvido',false).order('created_at',{ascending:false}).limit(3))||[];
  return `<div class="card"><p class="muted" style="margin-top:0">Notas por disciplina, ao longo dos períodos. Pais e treinador registam e acompanham a mesma evolução: o esforço na escola também conta.</p>
    ${podeEditar()?'<button class="btn gold full" onclick="novaNota()">+ Registar notas</button>':''}</div>
    ${ult.length?`<div class="card"><div class="kpis"><div class="kpi"><b>${ult.length}</b><small>disciplinas</small></div><div class="kpi"><b style="color:var(--mint)">${subir}</b><small>subiram</small></div><div class="kpi"><b style="color:var(--red)">${descer}</b><small>desceram</small></div></div></div>`:''}
    ${ult.map(u=>`<div class="card"><div class="row between"><h3 style="margin:0">${esc(u.disciplina)}</h3><span>${setaTend(u)} <b style="font-family:'Baloo 2';font-size:20px">${fmtNota(u.ult)}</b></span></div>
      ${spark(u.arr)}
      <div class="row wrap" style="gap:5px">${u.arr.map(n=>`<button class="chip" style="border:0" onclick="${podeEditar()?`editarNota('${n.id}')`:''}">${esc(n.periodo.replace(' Período','P').replace(' Semestre','S'))} ${esc(n.ano_letivo)}: ${fmtNota(n)}</button>`).join('')}</div></div>`).join('')||'<div class="card"><p class="empty">Ainda sem notas. Registe as do último período para começar a ver a evolução.</p></div>'}
    <div class="card"><div class="row between"><h3>Na escola, a melhorar</h3><button class="btn ghost sm" onclick="S.obsFiltro='escola';S.jogTab='melhorar';vJogador()">Ver</button></div>${obsE.length?obsE.map(o=>`<div class="obs melhorar">${esc(o.texto)}</div>`).join(''):'<p class="muted">Nada registado.</p>'}</div>`;
}
function novaNota(){
  if(!podeEditar())return;
  const anos=[anoLetivoAtual()];const y=parseInt(anoLetivoAtual());for(let i=1;i<4;i++)anos.push(`${y-i}/${String(y-i+1).slice(2)}`);
  openSheet(`<h2>Registar notas</h2>
  <div class="row"><div class="grow"><label class="f" for="nAno">Ano letivo</label><select id="nAno" class="in">${anos.map(a=>`<option>${a}</option>`).join('')}</select></div>
  <div class="grow"><label class="f" for="nPer">Período</label><select id="nPer" class="in">${PERIODOS.map(p=>`<option>${p}</option>`).join('')}</select></div></div>
  <label class="f" for="nEsc">Escala</label><select id="nEsc" class="in" onchange="linhasNotas()">${Object.entries(ESCALAS).map(([k,v])=>`<option value="${k}">${v.nome}</option>`).join('')}</select>
  <p class="faint">Preencha só as disciplinas que tem. Deixe em branco as restantes.</p>
  <div id="nLinhas"></div>
  <label class="f" for="nOutra">Outra disciplina</label><div class="row"><input id="nOutra" class="in grow" placeholder="Nome"><input id="nOutraV" class="in" style="width:90px" placeholder="Nota" inputmode="decimal"></div>
  <button class="btn full" style="margin-top:14px" onclick="guardarNotas()">Guardar notas</button>`);
  linhasNotas();
}
function linhasNotas(){
  const e=g('nEsc');
  const campo=d=>e==='IS-MB'?`<select class="in" data-d="${esc(d)}" style="width:150px"><option value=""></option>${MB_LABELS.slice(1).map((l,i)=>`<option value="${i+1}">${l}</option>`).join('')}</select>`
    :`<input class="in" data-d="${esc(d)}" style="width:90px" inputmode="decimal" placeholder="${ESCALAS[e].min}–${ESCALAS[e].max}">`;
  $('#nLinhas').innerHTML=DISCIPLINAS.map(d=>`<div class="row between" style="margin:6px 0"><span style="font-size:14px">${d}</span>${campo(d)}</div>`).join('');
}
async function guardarNotas(){
  const esc_=g('nEsc'),lim=ESCALAS[esc_];const rows=[];let erro=false;
  const add=(d,v)=>{v=String(v).replace(',','.').trim();if(!v)return;const n=parseFloat(v);if(isNaN(n)||n<lim.min||n>lim.max){erro=d;return}rows.push({jogador_id:S.jog,ano_letivo:g('nAno'),periodo:g('nPer'),disciplina:d,nota:n,escala:esc_,autor_id:S.me})};
  document.querySelectorAll('#nLinhas [data-d]').forEach(i=>add(i.dataset.d,i.value));
  if(g('nOutra'))add(g('nOutra'),g('nOutraV'));
  if(erro){toast(`Nota inválida em ${erro} (${lim.min} a ${lim.max})`);return}
  if(!rows.length){toast('Escreva pelo menos uma nota');return}
  const r=await q(sb.from('fut_notas_escola').upsert(rows,{onConflict:'jogador_id,ano_letivo,periodo,disciplina'}));if(r===null)return;
  closeSheet();vJogador();toast(`${rows.length} nota(s) guardada(s)`);
}
async function editarNota(id){
  const n=(await q(sb.from('fut_notas_escola').select('*').eq('id',id).single()));if(!n)return;
  openSheet(`<h2>${esc(n.disciplina)}</h2><p class="muted">${esc(n.periodo)} · ${esc(n.ano_letivo)}</p>
  <label class="f" for="enV">Nota</label><input id="enV" class="in" inputmode="decimal" value="${n.nota}">
  <button class="btn full" style="margin-top:12px" onclick="guardarNota('${id}','${n.escala}')">Guardar</button>
  <button class="btn red full" style="margin-top:8px" onclick="apagarNota('${id}')">Apagar esta nota</button>`)}
async function guardarNota(id,e){const v=parseFloat(g('enV').replace(',','.'));const l=ESCALAS[e];if(isNaN(v)||v<l.min||v>l.max){toast(`Entre ${l.min} e ${l.max}`);return}
  await q(sb.from('fut_notas_escola').update({nota:v}).eq('id',id));closeSheet();vJogador()}
async function apagarNota(id){await q(sb.from('fut_notas_escola').delete().eq('id',id));closeSheet();vJogador()}

/* evolução (competências) */
function resumoComp(av){const por={};[...av].sort((a,b)=>a.data.localeCompare(b.data)).forEach(a=>{(por[a.competencia]=por[a.competencia]||[]).push(a)});
  return Object.entries(por).map(([c,arr])=>({competencia:c,nivel:arr[arr.length-1].nivel,ant:arr.length>1?arr[arr.length-2].nivel:null,hist:arr}))}
async function jEvolucao(j){
  const [av,pres]=await Promise.all([q(sb.from('fut_avaliacoes').select('*').eq('jogador_id',j.id)),q(sb.from('fut_presencas').select('*').eq('jogador_id',j.id))]);
  const comp=resumoComp(av||[]);
  const regs=(pres||[]).map(p=>({...p,ev:S.eventos.find(e=>e.id===p.evento_id)})).filter(p=>p.ev&&(p.esforco||p.atitude||p.minutos!=null)).sort((a,b)=>b.ev.data.localeCompare(a.ev.data));
  return `${isCoach()?'<div class="card"><button class="btn gold full" onclick="avaliar()">+ Avaliar competências</button></div>':''}
  <div class="card"><h3>Competências</h3><p class="faint" style="margin-top:0">1 A começar · 2 Em progresso · 3 Já consegue · 4 Domina</p>
  ${comp.length?comp.map(c=>`<div style="margin:10px 0"><div class="row between"><span>${esc(c.competencia)} ${c.ant&&c.nivel>c.ant?'<span style="color:var(--mint)">▲</span>':''}</span><span class="faint">${NIVEIS[c.nivel]}</span></div><div class="bar"><i style="width:${c.nivel*25}%"></i></div></div>`).join(''):'<p class="empty">Ainda sem avaliações.</p>'}</div>
  <div class="card"><h3>Treinos e jogos</h3>${regs.length?`<div class="list">${regs.slice(0,15).map(r=>`<div><div class="row between"><b style="font-size:14px">${r.ev.tipo==='jogo'?'⚽ vs '+esc(r.ev.adversario||''):'🏃 Treino'}</b><span class="faint">${dataCurta(r.ev.data)}</span></div><div class="muted">${r.minutos!=null?r.minutos+' min · ':''}${r.esforco?'esforço '+r.esforco+'/5 · ':''}${r.atitude?'atitude '+r.atitude+'/5':''}${r.competencia?' · trabalhou '+esc(r.competencia):''}</div></div>`).join('')}</div>`:'<p class="empty">O treinador ainda não registou nada.</p>'}</div>`;
}
let AV={};
function avaliar(){
  AV={};
  openSheet(`<h2>Avaliar competências</h2><p class="muted">Toque no nível de cada competência que quer atualizar.</p>
  ${COMPETENCIAS.map((c,ci)=>`<div style="margin:12px 0"><b style="font-size:14px">${c}</b><div class="opts" id="av${ci}" style="margin-top:5px">${[1,2,3,4].map(n=>`<button onclick="AV[${ci}]=${n};document.querySelectorAll('#av${ci} button').forEach((b,i)=>b.classList.toggle('on',i+1===${n}))">${n} ${NIVEIS[n]}</button>`).join('')}</div></div>`).join('')}
  <button class="btn full" style="margin-top:14px" onclick="guardarAvaliacao()">Guardar</button>`)}
async function guardarAvaliacao(){
  const rows=Object.entries(AV).map(([ci,n])=>({jogador_id:S.jog,competencia:COMPETENCIAS[ci],nivel:n,autor_id:S.me}));
  if(!rows.length){toast('Escolha pelo menos um nível');return}
  await q(sb.from('fut_avaliacoes').insert(rows));closeSheet();vJogador();toast('Avaliação guardada');
}

/* objetivos */
async function jObjetivos(j){
  const ob=await q(sb.from('fut_objetivos').select('*').eq('jogador_id',j.id).order('created_at',{ascending:false}))||[];
  const it=o=>`<div class="row between"><label class="check grow" style="margin:0"><input type="checkbox" ${o.cumprido?'checked':''} onchange="cumprirObj('${o.id}',this.checked)"><span><span class="chip ${o.area==='escola'?'':'gold'}">${o.area==='escola'?'📚':'⚽'}</span> ${esc(o.texto)}</span></label>${o.autor_id===S.me?`<button class="btn red sm" onclick="apagarObj('${o.id}')">✕</button>`:''}</div>`;
  const ab=ob.filter(o=>!o.cumprido),cu=ob.filter(o=>o.cumprido);
  return `<div class="card"><p class="muted" style="margin-top:0">Objetivos pequenos, escolhidos com a criança. Um ou dois de cada vez. Celebre quando cumprir!</p>
  <div class="row"><select id="obArea" class="in" style="width:110px"><option value="futsal">⚽ Futsal</option><option value="escola">📚 Escola</option></select><input id="obTxt" class="in grow" placeholder="Ex.: usar o pé esquerdo nos passes"></div>
  <button class="btn gold full" style="margin-top:8px" onclick="novoObj()">+ Acrescentar objetivo</button></div>
  <div class="card"><h3>Em curso</h3>${ab.length?`<div class="list">${ab.map(it).join('')}</div>`:'<p class="empty">Sem objetivos em curso.</p>'}</div>
  ${cu.length?`<div class="card"><h3>🎉 Cumpridos (${cu.length})</h3><div class="list">${cu.map(it).join('')}</div></div>`:''}`;
}
async function novoObj(){if(!g('obTxt')){toast('Escreva o objetivo');return}await q(sb.from('fut_objetivos').insert({jogador_id:S.jog,texto:g('obTxt'),area:g('obArea'),autor_id:S.me}));vJogador()}
async function cumprirObj(id,v){await q(sb.from('fut_objetivos').update({cumprido:v}).eq('id',id));if(v)toast('🎉 Objetivo cumprido! Parabéns!');vJogador()}
async function apagarObj(id){await q(sb.from('fut_objetivos').delete().eq('id',id));vJogador()}

/* desafios em casa */
async function jDesafios(j){
  const feitos=await q(sb.from('fut_desafios_feitos').select('*').eq('jogador_id',j.id))||[];
  const pts=feitos.reduce((s,f)=>s+(S.desafios.find(d=>d.id===f.desafio_id)?.pontos||0),0);
  const semana=feitos.filter(f=>f.data>=addDias(-6)).length;
  return `<div class="card"><div class="kpis"><div class="kpi"><b>${pts}</b><small>pontos</small></div><div class="kpi"><b>${feitos.length}</b><small>desafios feitos</small></div><div class="kpi"><b>${semana}</b><small>esta semana</small></div></div>
  <p class="faint" style="margin:10px 0 0">${pts>=200?'🏆 Medalha de ouro':pts>=100?'🥈 Medalha de prata':pts>=40?'🥉 Medalha de bronze':'Faltam '+(40-pts)+' pontos para a medalha de bronze'}</p></div>
  ${isCoach()?'<div class="card"><button class="btn gold full" onclick="novoDesafio()">+ Criar desafio para a equipa</button></div>':''}
  ${S.desafios.map(d=>{const n=feitos.filter(f=>f.desafio_id===d.id).length;const hj=feitos.some(f=>f.desafio_id===d.id&&f.data===hoje());return `<div class="card"><div class="row between"><h3 style="margin:0">${esc(d.titulo)}</h3><span class="chip gold">${d.pontos} pts</span></div><p class="muted">${esc(d.descricao||'')}</p>
    ${d.video_url?`<p><a href="${esc(d.video_url)}" target="_blank" rel="noopener">▶ Ver vídeo</a></p>`:''}
    <div class="row between"><span class="faint">${d.minutos} min · feito ${n}x</span>${hj?'<span class="chip mint">✔ Feito hoje</span>':`<button class="btn sm" onclick="feitoDesafio('${d.id}','${j.id}').then(vJogador)">✔ Fez hoje</button>`}</div>
    ${isCoach()?`<button class="btn red sm" style="margin-top:8px" onclick="arquivarDesafio('${d.id}')">Retirar desafio</button>`:''}</div>`}).join('')||'<div class="card"><p class="empty">Sem desafios ativos.</p></div>'}`;
}
function novoDesafio(){openSheet(`<h2>Novo desafio</h2><label class="f" for="dT">Título</label><input id="dT" class="in"><label class="f" for="dD">Como se faz</label><textarea id="dD" class="in"></textarea>
  <label class="f" for="dV">Link de vídeo (opcional)</label><input id="dV" class="in" type="url" placeholder="https://">
  <div class="row"><div class="grow"><label class="f" for="dM">Minutos</label><input id="dM" type="number" class="in" value="10"></div><div class="grow"><label class="f" for="dP">Pontos</label><input id="dP" type="number" class="in" value="10"></div></div>
  <button class="btn full" style="margin-top:14px" onclick="guardarDesafio()">Criar</button>`)}
async function guardarDesafio(){if(!g('dT')){toast('Escreva o título');return}const v=g('dV');
  await q(sb.from('fut_desafios').insert({equipa_id:S.eq.id,titulo:g('dT'),descricao:g('dD')||null,video_url:/^https?:\/\//.test(v)?v:null,minutos:parseInt(g('dM'))||10,pontos:parseInt(g('dP'))||10}));
  closeSheet();await carregar();vJogador();toast('Desafio criado')}
async function arquivarDesafio(id){await q(sb.from('fut_desafios').update({ativo:false}).eq('id',id));await carregar();vJogador()}

/* emoções */
async function jEmocoes(j){
  const em=await q(sb.from('fut_emocoes').select('*').eq('jogador_id',j.id).order('created_at',{ascending:false}).limit(30))||[];
  const cont={};em.forEach(e=>cont[e.emocao]=(cont[e.emocao]||0)+1);
  return `<div class="card"><p class="muted" style="margin-top:0">Depois de cada jogo ou treino, a criança escolhe como se sentiu. Ajuda a perceber cedo quando algo não está bem.</p>
  <button class="btn gold full" onclick="novaEmocao('${j.id}')">+ Como se sentiu hoje?</button></div>
  ${em.length?`<div class="card"><h3>Últimas semanas</h3><div class="row wrap" style="gap:6px">${EMOCOES.filter(e=>cont[e[1]]).map(e=>`<span class="chip">${e[0]} ${e[1]} · ${cont[e[1]]}</span>`).join('')}</div></div>

/* ---------- avaliação trimestral 3S (pais, treinador, professores, aluno) ---------- */
const QUEST=[
 {dim:'Saber',id:'s1',o:'Está atento e concentrado nas tarefas',e:'Consigo estar atento e concentrado'},
 {dim:'Saber',id:'s2',o:'Esforça-se para aprender coisas novas',e:'Esforço-me para aprender coisas novas'},
 {dim:'Saber',id:'s3',o:'Cumpre as tarefas com responsabilidade (estudo, treinos, casa)',e:'Faço as minhas tarefas (estudo, treinos, casa)'},
 {dim:'Sentir',id:'e1',o:'Lida bem com erros, derrotas e notas baixas',e:'Quando erro ou perco, acalmo-me e tento outra vez'},
 {dim:'Sentir',id:'e2',o:'Mostra confiança em si próprio',e:'Acredito em mim'},
 {dim:'Sentir',id:'e3',o:'Parece feliz e motivado',e:'Sinto-me feliz e com vontade de fazer as coisas'},
 {dim:'Sentir',id:'e4',o:'Diz o que sente de forma calma e respeitosa',e:'Consigo dizer o que sinto sem gritar nem magoar'},
 {dim:'Ser',id:'v1',o:'Respeita adultos, colegas e regras',e:'Respeito os adultos, os colegas e as regras'},
 {dim:'Ser',id:'v2',o:'Coopera e ajuda os colegas',e:'Ajudo os meus colegas e jogo em equipa'},
 {dim:'Ser',id:'v3',o:'É pontual e cumpre o que combina',e:'Chego a horas e cumpro o que combino'},
 {dim:'Hábitos',id:'h1',o:'Dorme o suficiente e anda descansado',e:'Durmo bem e acordo descansado'},
 {dim:'Hábitos',id:'h2',o:'Usa ecrãs (telemóvel, consola, TV) com moderação',e:'Uso o telemóvel, a consola e a TV só um bocadinho'},
 {dim:'Hábitos',id:'h3',o:'Alimenta-se de forma saudável (poucos doces e refrigerantes)',e:'Como bem e bebo poucos refrigerantes'},
 {dim:'Hábitos',id:'h4',o:'Mantém-se afastado de tabaco, vape e álcool',e:'Fico longe do tabaco, do vape e do álcool',velhos:true}
];
const DIMS=[['Saber','🧠','Aprender'],['Sentir','💛','Emoções'],['Ser','🌱','Valores e relações'],['Hábitos','🏅','Para ser atleta']];
const ESC4=['','Nunca','Raramente','Às vezes','Muitas vezes','Sempre'];
const ESC4K=[['',''],['😟','Nunca'],['😕','Raramente'],['🙂','Às vezes'],['😀','Muitas vezes'],['🤩','Sempre']];
const TIPOS360=[['pai','Pais'],['treinador','Treinador'],['professor','Professores'],['aluno','Aluno']];
const trimDe=d=>{const x=new Date((d||hoje())+'T12:00');return x.getFullYear()+'-T'+(Math.floor(x.getMonth()/3)+1)};
const trimAtual=()=>trimDe(hoje());
const trimLabel=t=>{const [y,q]=t.split('-T');return ['Jan–Mar','Abr–Jun','Jul–Set','Out–Dez'][q-1]+' '+y};
const trimRange=t=>{const [y,q]=t.split('-T').map(Number);const m=(q-1)*3;const ini=new Date(Date.UTC(y,m,1)),fim=new Date(Date.UTC(y,m+3,0));return [ini.toISOString().slice(0,10),fim.toISOString().slice(0,10)]};
const trimAnterior=t=>{let [y,q]=t.split('-T').map(Number);q--;if(!q){q=4;y--}return y+'-T'+q};
function eVelho(escalao,ano){const m=String(escalao||'').match(/sub-(\d+)/);if(m&&+m[1]>=12)return true;const a=parseInt(ano||'');return a>=7}
function questoesPara(velho){return QUEST.filter(q=>!q.velhos||velho)}
function mediaDim(lista,dim){const v=[];lista.forEach(a=>QUEST.filter(q=>q.dim===dim).forEach(q=>{const n=a.respostas?.[q.id];if(n)v.push(n)}));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
const fmt1=n=>n==null?'–':n.toFixed(1).replace('.',',');

/* questionário interativo: uma pergunta de cada vez */
let QZ=null;
function abrirQuestionario(cfg){
  // cfg: {modo:'pai'|'treinador'|'aluno'|'professor', nome, velho, jogadorId?, token?, anterior?, host?}
  QZ={...cfg,passo:0,resp:{...(cfg.anterior?.respostas||{})},forcas:cfg.anterior?.forcas||'',melhorar:cfg.anterior?.melhorar||'',comentario:cfg.anterior?.comentario||'',nomeResp:cfg.nomeResp||''};
  QZ.qs=questoesPara(cfg.velho);
  qzRender();
}
function qzHost(html){if(QZ.host==='screen'){$('#screen').innerHTML=`<div class="login" style="padding-top:calc(24px + env(safe-area-inset-top,0px))">${html}</div>`;window.scrollTo(0,0)}else openSheet(html)}
function qzRender(){
  const eu=QZ.modo==='aluno';const total=QZ.qs.length;const p=QZ.passo;
  const barra=`<div class="bar" style="margin:8px 0 16px"><i style="width:${Math.round(Math.min(p,total+1)/(total+1)*100)}%"></i></div>`;
  if(p===0){
    qzHost(`<div style="text-align:center">${ESCUDO(56)}</div>
    <h2 style="text-align:center;margin-top:8px">${eu?`Olá, ${esc(QZ.nome)}!`:`Avaliação de ${esc(QZ.nome)}`}</h2>
    <p class="muted" style="text-align:center">${trimLabel(QZ.trim)} · ${QZ.qs.length} perguntas rápidas</p>
    <div class="card" style="margin-top:12px"><p style="margin:0">${eu?'Vamos pensar em como te correram estes 3 meses. Não há respostas certas nem erradas: responde com sinceridade, a pensar em ti.':`Pais, treinador, professores e o próprio ${esc(QZ.nome)} respondem às mesmas perguntas. Juntas, as respostas mostram como está a crescer: a aprender (Saber), nas emoções (Sentir) e nos valores e hábitos (Ser).`}</p>
    <p class="faint" style="margin:10px 0 0">${eu?'Demora uns 3 minutos.':'Demora uns 4 minutos. Se não souber responder a alguma pergunta, escolha «Não sei».'}</p></div>
    ${QZ.modo==='professor'?`<label class="f" for="qzNome">O seu nome e disciplina</label><input id="qzNome" class="in" value="${esc(QZ.nomeResp)}" placeholder="Ex.: Prof.ª Ana Silva – Matemática">`:''}
    <button class="btn gold full" style="margin-top:16px" onclick="qzComecar()">Começar</button>
    ${QZ.host!=='screen'?'<button class="btn ghost full" style="margin-top:8px" onclick="closeSheet()">Agora não</button>':''}`);
    return;
  }
  if(p<=total){
    const q=QZ.qs[p-1];const v=QZ.resp[q.id];const d=DIMS.find(x=>x[0]===q.dim);
    const ops=eu?[1,2,3,4,5].map(n=>`<button class="${v===n?'on':''}" style="flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px" onclick="qzResp('${q.id}',${n})"><span style="font-size:30px">${ESC4K[n][0]}</span><span style="font-size:12px">${ESC4K[n][1]}</span></button>`).join('')
      :[1,2,3,4,5].map(n=>`<button class="${v===n?'on':''}" style="flex:1 1 30%;padding:14px 8px" onclick="qzResp('${q.id}',${n})">${ESC4[n]}</button>`).join('')+`<button class="${v===0?'on':''}" style="flex:1 1 100%;padding:10px" onclick="qzResp('${q.id}',0)">Não sei</button>`;
    qzHost(`${barra}<div class="row between"><span class="chip gold">${d[1]} ${d[0]} · ${d[2]}</span><span class="faint">${p} de ${total}</span></div>
    <h2 style="margin:18px 0 18px;font-size:23px">${eu?esc(q.e):esc(q.o)}</h2>
    <div class="opts" style="gap:8px">${ops}</div>
    <div class="row between" style="margin-top:20px"><button class="btn ghost sm" onclick="QZ.passo--;qzRender()">‹ Voltar</button>${v!=null?`<button class="btn sm" onclick="QZ.passo++;qzRender()">Seguinte ›</button>`:''}</div>`);
    return;
  }
  qzHost(`${barra}<h2>${eu?'Quase a acabar!':'Para terminar'}</h2>
  <b style="display:block;margin-top:10px">${eu?'Em que é que sou bom/boa?':'Pontos fortes'}</b><div class="faint">Escolha até 3</div><div id="qzFw" style="margin-top:6px">${qzChips('forcas',FORCAS_OP)}</div>
  <b style="display:block;margin-top:14px">${eu?'O que quero melhorar nos próximos 3 meses?':'O que pode melhorar nos próximos 3 meses'}</b><div class="faint">Escolha até 3</div><div id="qzMw" style="margin-top:6px">${qzChips('melhorar',MELHORAR_OP)}</div>
  <button class="btn gold full" style="margin-top:14px" onclick="qzEnviar()">${eu?'Enviar 🎉':'Enviar avaliação'}</button>
  <button class="btn ghost full sm" style="margin-top:8px" onclick="QZ.passo--;qzRender()">‹ Voltar</button>`);
}
const FORCAS_OP=['Empenho','Respeito','Espírito de equipa','Técnica','Visão de jogo','Liderança','Alegria','Responsabilidade','Concentração','Resiliência'];
const MELHORAR_OP=['Concentração','Controlo das emoções','Respeito pelas regras','Pontualidade','Técnica','Comunicação','Confiança','Hábitos de sono','Estudo','Persistência'];
function qzChips(k,op){const sel=(QZ[k]||'').split(', ').filter(Boolean);return `<div class="row wrap" style="gap:6px">${op.map((o,i)=>`<button class="chip" style="border:0;cursor:pointer;padding:8px 10px;${sel.includes(o)?'background:var(--navy);color:#fff':''}" onclick="qzTogChip('${k}',${i})">${sel.includes(o)?'✔ ':''}${o}</button>`).join('')}</div>`}
function qzTogChip(k,i){const op=k==='forcas'?FORCAS_OP:MELHORAR_OP;const o=op[i];let sel=(QZ[k]||'').split(', ').filter(Boolean);if(sel.includes(o))sel=sel.filter(x=>x!==o);else{if(sel.length>=3){toast('Escolha até 3');return}sel.push(o)}QZ[k]=sel.join(', ');$(k==='forcas'?'#qzFw':'#qzMw').innerHTML=qzChips(k,op)}
function qzComecar(){if(QZ.modo==='professor'){QZ.nomeResp=g('qzNome');if(!QZ.nomeResp){toast('Escreva o seu nome e disciplina');return}}QZ.passo=1;qzRender()}
function qzResp(id,n){QZ.resp[id]=n;setTimeout(()=>{QZ.passo++;qzRender()},180);qzRender()}
async function qzEnviar(){

  const resp={};Object.entries(QZ.resp).forEach(([k,v])=>{if(v)resp[k]=v});
  if(QZ.token){
    const {error}=await sb.rpc('fut_convite_responder',{p_token:QZ.token,p_nome:QZ.nomeResp||null,p_respostas:resp,p_forcas:QZ.forcas||null,p_melhorar:QZ.melhorar||null,p_comentario:QZ.comentario||null});

  }

  const r=QZ.anterior?.id?await q(sb.from('fut_avaliacoes_360').update(row).eq('id',QZ.anterior.id)):await q(sb.from('fut_avaliacoes_360').insert(row));
  if(r===null)return;

function estadoExame(ex){
  if(!ex)return ['Sem exame registado','red'];
  if(ex.resultado==='nao_apto')return ['Não apto','red'];
  if(!ex.valido_ate)return [RESULT_EXAME[ex.resultado][0],RESULT_EXAME[ex.resultado][1]];

}

function marcaPresenca(p){if(!p)return ['–','faint','Sem registo'];if(p.presente===true)return ['✔','mint','Presente'];if(p.presente===false)return [p.resposta==='nao_vai'?'J':'✖',p.resposta==='nao_vai'?'gold':'red',p.resposta==='nao_vai'?'Faltou (avisou)':'Faltou'];if(p.resposta==='nao_vai')return ['J','gold','Avisou que faltava'];return ['–','faint','Sem registo']}
async function jPresencas(j){
  const evs=await q(sb.from('fut_eventos').select('*').eq('equipa_id',S.eq.id).lte('data',hoje()).gte('data',addDias(-180)).order('data',{ascending:false}))||[];
  const pres=evs.length?(await q(sb.from('fut_presencas').select('*').eq('jogador_id',j.id).in('evento_id',evs.map(e=>e.id)))||[]):[];
  const pm=Object.fromEntries(pres.map(p=>[p.evento_id,p]));
  const conta=t=>{const es=evs.filter(e=>e.tipo===t);const pr=es.filter(e=>pm[e.id]?.presente===true).length;return [pr,es.length]};
  const [pt,tt]=conta('treino'),[pj,tj]=conta('jogo');
  let seq=0;for(const e of evs){if(pm[e.id]?.presente===true)seq++;else if(pm[e.id]?.presente===false)break}
  const pctT=tt?Math.round(pt/tt*100):0;
  return `<div class="card" style="background:var(--navy);color:#fff"><div class="row between"><div><div style="font-size:12px;opacity:.75">CARTÃO DE PRESENÇAS</div><h2 style="color:#fff;margin:2px 0 0">${esc(j.nome)}</h2><div style="font-size:13px;opacity:.8">${esc(S.eq.nome)} · últimos 6 meses</div></div><div>${ESCUDO(40)}</div></div>
    <div class="kpis" style="margin-top:14px"><div class="kpi" style="background:rgba(255,255,255,.1)"><b style="color:#fff">${pctT}%</b><small style="color:#E7EAF1">treinos (${pt}/${tt})</small></div><div class="kpi" style="background:rgba(255,255,255,.1)"><b style="color:#fff">${pj}/${tj}</b><small style="color:#E7EAF1">jogos</small></div><div class="kpi" style="background:rgba(255,255,255,.1)"><b style="color:var(--gold)">${seq}</b><small style="color:#E7EAF1">seguidas</small></div></div>
    <div class="bar" style="margin-top:12px;background:rgba(255,255,255,.15)"><i style="width:${pctT}%"></i></div>
    <p style="margin:10px 0 0;font-size:13px;opacity:.85">${pctT>=90?'🏅 Assiduidade de ouro!':pctT>=75?'💪 Muito assíduo, continua!':tt?'Cada treino conta. Vamos a isso!':'Ainda sem treinos registados.'}</p></div>
  <div class="card"><h3>Registo</h3><p class="faint" style="margin-top:0">✔ presente · ✖ faltou · J avisou que faltava · – sem registo</p>
    ${evs.length?`<div class="list">${evs.slice(0,40).map(e=>{const mk=marcaPresenca(pm[e.id]);return `<div class="row"><span class="chip ${mk[1]==='faint'?'':mk[1]}" style="min-width:34px;justify-content:center" aria-label="${mk[2]}">${mk[0]}</span><div class="grow"><b style="font-size:14px">${e.tipo==='jogo'?'⚽ Jogo vs '+esc(e.adversario||''):'🏃 Treino'}</b><div class="faint">${diaSemana(e.data)}, ${new Date(e.data+'T12:00').toLocaleDateString('pt-PT')}</div></div></div>`}).join('')}</div>`:'<p class="empty">Ainda sem treinos ou jogos passados.</p>'}</div>`;
}
async function mapaPresencas(){
  const evs=(await q(sb.from('fut_eventos').select('*').eq('equipa_id',S.eq.id).lte('data',hoje()).order('data',{ascending:false}).limit(10))||[]).reverse();
  if(!evs.length){openSheet('<h2>Mapa de presenças</h2><p class="empty">Ainda sem treinos ou jogos passados.</p>');return}
  const pres=await q(sb.from('fut_presencas').select('*').in('evento_id',evs.map(e=>e.id)))||[];
  const pm={};pres.forEach(p=>pm[p.evento_id+'|'+p.jogador_id]=p);
  openSheet(`<h2>Mapa de presenças</h2><p class="muted">Últimos ${evs.length} treinos e jogos. Toque num nome para ver o cartão.</p>
  <div style="overflow-x:auto;margin-top:8px"><table style="border-collapse:collapse;font-size:13px;min-width:100%">
  <tr><th style="text-align:left;padding:6px;position:sticky;left:0;background:var(--bg)">Jogador</th>${evs.map(e=>`<th style="padding:4px;font-weight:600;color:var(--soft);white-space:nowrap">${e.tipo==='jogo'?'⚽':''}${new Date(e.data+'T12:00').getDate()}/${new Date(e.data+'T12:00').getMonth()+1}</th>`).join('')}<th style="padding:4px">%</th></tr>
  ${S.jogadores.map(j=>{let pr=0;const cel=evs.map(e=>{const p=pm[e.id+'|'+j.id];if(p?.presente)pr++;const mk=marcaPresenca(p);return `<td style="text-align:center;padding:5px;color:var(--${mk[1]==='faint'?'faint':mk[1]==='mint'?'mint':mk[1]==='gold'?'gold':'red'})" title="${mk[2]}">${mk[0]}</td>`}).join('');
    return `<tr style="border-top:1px solid var(--line)"><td style="padding:6px;white-space:nowrap;position:sticky;left:0;background:var(--bg)"><button style="border:0;background:none;padding:0;font-weight:600;color:var(--ink);font-size:13px" onclick="abrirJogador('${j.id}','presencas')">${esc(j.nome.split(' ')[0])} ${esc((j.nome.split(' ').slice(-1)[0]||'')[0]||'')}.</button></td>${cel}<td style="text-align:center;font-weight:700">${Math.round(pr/evs.length*100)}%</td></tr>`}).join('')}
  </table></div><p class="faint">Para marcar presenças, abra o treino na Agenda e toque em ✔ ou ✖.</p>`);
}
async function marcarPresente(ev,j,v){
  await q(sb.from('fut_presencas').upsert({evento_id:ev,jogador_id:j,presente:v},{onConflict:'evento_id,jogador_id'}));
  const p=respostaDe(ev,j);if(p)p.presente=v;else S.presencas.push({evento_id:ev,jogador_id:j,presente:v});
  abrirEvento(ev);
}

function graficoFPF(lista){
  const W=320,Hh=170,L=26,R=34,T=10,B=28;const n=lista.length;const xs=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1);const ys=v=>T+(4-v)/3*(Hh-T-B);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto;display:block" role="img" aria-label="Gráfico da evolução das componentes FPF">`;
  [1,2,3,4].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#E8DDCF" stroke-width="1"/><text x="${L-8}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="#5E6782">${v}</text>`});
  lista.forEach((f,i)=>{s+=`<text x="${xs(i)}" y="${Hh-8}" font-size="9" text-anchor="middle" fill="#5E6782">${esc(f.periodo.split(' · ')[0].replace(' Período','P'))} ${esc((f.periodo.split('Época ')[1]||'').trim())}</text>`});
  FPF.forEach(c=>{const pts=lista.map((f,i)=>[xs(i),mediaFPF(f.niveis,c.k)]).filter(p=>p[1]!=null);
    if(pts.length>1)s+=`<polyline fill="none" stroke="${c.c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p[0]+','+ys(p[1])).join(' ')}"/>`;
    pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${ys(p[1])}" r="4" fill="${c.c}"><title>${c.t}: ${fmt1(p[1])}</title></circle>`})});
  return s+'</svg>';
}

const RESP_PA=['Atleta','Pais','Treinador','Escola'];
async function sugestoesPlano(j){
  const [F,av,obs,notas,comp]=await Promise.all([
    q(sb.from('fut_fichas_fpf').select('*').eq('jogador_id',j.id).order('created_at',{ascending:false}).limit(1)),
    q(sb.from('fut_avaliacoes_360').select('respostas').eq('jogador_id',j.id).eq('trimestre',trimAtual())),
    isAtleta()?[]:q(sb.from('fut_observacoes').select('*').eq('jogador_id',j.id).eq('tipo','melhorar').eq('resolvido',false)),
    q(sb.from('fut_notas_escola').select('*').eq('jogador_id',j.id)),
    q(sb.from('fut_avaliacoes').select('*').eq('jogador_id',j.id))
  ]);
  const s=[];
  const f=F&&F[0];if(f)FPF.forEach(c=>c.p.forEach((p,i)=>{const v=f.niveis?.[campoFPF(c.k,i)];if(v&&v<=2)s.push({area:c.k==='4'?'escola':c.k==='3'?'atitude':'futsal',melhorar:p,origem:`Ficha FPF (nível ${v})`,resp:c.k==='4'?'Pais':'Treinador'})}));
  QUEST.forEach(qq=>{const v=(av||[]).map(a=>a.respostas?.[qq.id]).filter(Boolean);if(v.length){const m=v.reduce((a,b)=>a+b,0)/v.length;if(m<=2.6)s.push({area:qq.dim==='Hábitos'?'saude':'atitude',melhorar:qq.o,origem:`Avaliação 3S (média ${fmt1(m)})`,resp:qq.dim==='Hábitos'?'Pais':'Atleta'})}});
  (obs||[]).forEach(o=>s.push({area:o.contexto==='escola'?'escola':'futsal',melhorar:o.texto,origem:`Observação · ${CONTEXTOS[o.contexto]}`,resp:o.contexto==='escola'||o.contexto==='casa'?'Pais':'Treinador'}));
  ultimasNotas(notas||[]).forEach(u=>{const neg=u.ult.escala==='0-20'?u.ult.nota<10:u.ult.escala==='IS-MB'?u.ult.nota<2:u.ult.nota<3;const desceu=u.ant&&pct(u.ult)<pct(u.ant);if(neg||desceu)s.push({area:'escola',melhorar:`${u.disciplina}: ${neg?'nota negativa':'a nota desceu'} (${fmtNota(u.ult)})`,origem:'Notas escolares',resp:'Escola'})});
  resumoComp(comp||[]).filter(c=>c.nivel<=1).forEach(c=>s.push({area:'futsal',melhorar:c.competencia,origem:'Competências (a começar)',resp:'Treinador'}));
  return s;
}

function graficoCheckin(h){const W=300,H=110,L=20,R=10,T=10,B=22,n=h.length;const xs=i=>L+i*(W-L-R)/Math.max(1,n-1);const ys=v=>T+(4-v)/3*(H-T-B);
  const m=h.map(x=>{const v=Object.values(x.dados);return v.reduce((a,b)=>a+b,0)/v.length});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Evolução semanal">${[1,2,3,4].map(v=>`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#E8DDCF"/>`).join('')}
  <polyline fill="none" stroke="var(--mint)" stroke-width="3" stroke-linejoin="round" points="${m.map((v,i)=>xs(i)+','+ys(v)).join(' ')}"/>${m.map((v,i)=>`<circle cx="${xs(i)}" cy="${ys(v)}" r="4" fill="var(--navy)"/><text x="${xs(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="#5E6782">${h[i].semana.split('-S')[1]}</text>`).join('')}</svg><p class="faint" style="margin:0">Média de cada semana (1 a 4). Números em baixo: semana do ano.</p>`}

function iqCampo(x){const v=S._iq[x.k];

  const sel=x.tipo==='multi'?(v||[]):[v];
  return `<div class="row wrap" style="gap:6px">${x.o.map((o,i)=>`<button class="chip" style="border:0;cursor:pointer;padding:8px 10px;${sel.includes(o)?'background:var(--navy);color:#fff':''}" onclick="iqTog('${x.k}',${i})">${sel.includes(o)?'✔ ':''}${o}</button>`).join('')}</div>`}

const pinK=uid=>'fut_pin_'+uid;
const pinGet=uid=>{try{return JSON.parse(localStorage.getItem(pinK(uid))||'null')}catch(_){return null}};
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let PIN={v:'',modo:'',uid:null,primeiro:'',depois:null};
function pinTeclado(tit,sub,extra){
  const dots=[0,1,2,3].map(i=>`<span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--navy);${i<PIN.v.length?'background:var(--navy)':''}"></span>`).join('');
  const k=n=>`<button style="width:72px;height:72px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 14px var(--shadow);font-size:26px;font-weight:700;color:var(--navy);cursor:pointer" onclick="pinTecla('${n}')">${n}</button>`;
  return `<div class="login" style="text-align:center"><div style="margin-bottom:10px">${ESCUDO(60)}</div><h1 style="font-size:24px">${tit}</h1><p class="muted" style="margin:4px 0 18px">${sub}</p>
  <div class="row" style="gap:16px;justify-content:center;margin-bottom:24px">${dots}</div>
  <div style="display:grid;grid-template-columns:repeat(3,72px);gap:16px;justify-content:center">${[1,2,3,4,5,6,7,8,9].map(k).join('')}<span></span>${k(0)}<button style="width:72px;height:72px;border:0;background:none;font-size:24px;cursor:pointer" onclick="pinTecla('⌫')" aria-label="Apagar">⌫</button></div>
  ${extra||''}</div>`}
function pinMostrar(){const sc=$('#screen');
  if(PIN.modo==='abrir'){const t=+(localStorage.getItem('fut_pin_err')||0);sc.innerHTML=pinTeclado('Introduza o seu PIN',t?`PIN errado. Restam ${5-t} tentativas.`:'Para abrir o Futsal 3S neste telemóvel.',`<button class="btn ghost sm" style="margin-top:22px" onclick="pinEsqueci()">Esqueci-me do PIN</button>`)}
  else if(PIN.modo==='criar')sc.innerHTML=pinTeclado('Crie o seu PIN','Escolha 4 números só seus. Não use a data de nascimento.',`<button class="btn ghost sm" style="margin-top:22px" onclick="pinSaltar()">Agora não</button>`);
  else if(PIN.modo==='confirmar')sc.innerHTML=pinTeclado('Confirme o PIN','Escreva os mesmos 4 números.',`<button class="btn ghost sm" style="margin-top:22px" onclick="PIN.modo='criar';PIN.v='';pinMostrar()">Recomeçar</button>`)}
async function pinTecla(n){if(n==='⌫'){PIN.v=PIN.v.slice(0,-1);pinMostrar();return}if(PIN.v.length>=4)return;PIN.v+=n;pinMostrar();if(PIN.v.length<4)return;
  await new Promise(r=>setTimeout(r,150));
  if(PIN.modo==='abrir'){const p=pinGet(PIN.uid);const ok=p&&await pinHash(PIN.v,p.s)===p.h;
    if(ok){localStorage.removeItem('fut_pin_err');S._bloq=false;const d=PIN.depois;PIN.v='';PIN.depois=null;if(d)await d();return}
    const t=+(localStorage.getItem('fut_pin_err')||0)+1;localStorage.setItem('fut_pin_err',t);PIN.v='';
    if(t>=5){localStorage.removeItem(pinK(PIN.uid));localStorage.removeItem('fut_pin_err');toast('5 tentativas erradas. Entre com o email e a palavra-passe.');await sb.auth.signOut();setTimeout(()=>location.reload(),1200);return}
    pinMostrar();return}
  if(PIN.modo==='criar'){if(/^(\d)\1{3}$/.test(PIN.v)||['1234','4321','0123','9876'].includes(PIN.v)){toast('PIN demasiado fácil. Escolha outro.');PIN.v='';pinMostrar();return}PIN.primeiro=PIN.v;PIN.v='';PIN.modo='confirmar';pinMostrar();return}
  if(PIN.modo==='confirmar'){if(PIN.v!==PIN.primeiro){toast('Os PIN não coincidem. Tente de novo.');PIN.v='';PIN.modo='criar';pinMostrar();return}
    const s=crypto.getRandomValues(new Uint32Array(4)).join('-');localStorage.setItem(pinK(PIN.uid),JSON.stringify({s,h:await pinHash(PIN.v,s)}));localStorage.removeItem('fut_pin_skip');
    PIN.v='';PIN.primeiro='';toast('PIN criado. Da próxima vez abre a app só com o PIN.');const d=PIN.depois;PIN.depois=null;if(d)await d()}}
async function pinEsqueci(){if(!confirm('Para criar um PIN novo, tem de entrar outra vez com o email e a palavra-passe. Continuar?'))return;localStorage.removeItem(pinK(PIN.uid));localStorage.removeItem('fut_pin_err');await sb.auth.signOut();location.reload()}
function pinSaltar(){try{localStorage.setItem('fut_pin_skip','1')}catch(_){}const d=PIN.depois;PIN.depois=null;PIN.v='';if(d)d()}
function pinCriar(uid,depois){PIN={v:'',modo:'criar',uid,primeiro:'',depois};pinMostrar()}
function pinPedir(uid,depois){PIN={v:'',modo:'abrir',uid,primeiro:'',depois};pinMostrar()}

    const ids=S.meus.map(j=>j.id);
    let ult={};
    if(ids.length){const ms=await q(sb.from('fut_mensagens').select('jogador_id,texto,created_at,autor_id').in('jogador_id',ids).order('created_at',{ascending:false}).limit(200));(ms||[]).forEach(x=>{if(!ult[x.jogador_id])ult[x.jogador_id]=x})}
    const lista=[...S.meus].sort((a,b)=>(ult[b.id]?.created_at||'').localeCompare(ult[a.id]?.created_at||''));
    m.innerHTML=tabs+`<div class="card">${lista.length?`<div class="list">${lista.map(j=>`<button class="item" onclick="abrirJogador('${j.id}','conversa')"><div class="av navy">${iniciais(j.nome)}</div><div class="grow"><b>${esc(j.nome)}</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ult[j.id]?esc(primeiro(nomeDe(ult[j.id].autor_id)))+': '+esc(ult[j.id].texto):'Sem mensagens'}</div></div></button>`).join('')}</div>`:'<p class="empty">Sem conversas.</p>'}</div>`;
  }
}
async function enviarAviso(){const t=g('avTxt');if(!t)return;await q(sb.from('fut_mensagens').insert({equipa_id:S.eq.id,autor_id:S.me,texto:t}));await carregar();vMensagens();toast('Aviso enviado')}
async function apagarAviso(id){await q(sb.from('fut_mensagens').delete().eq('id',id));await carregar();vMensagens()}

/* ---------- guia ---------- */
const GUIA=[
 {t:'Saber',i:'🧠',c:[
  ['O que o seu filho precisa da bancada','Apoio para todos e silêncio técnico. As instruções vêm do treinador; duas vozes ao mesmo tempo confundem a criança.'],
  ['Sono é treino','Dos 6 aos 12 anos, 9 a 12 horas por noite; dos 13 aos 18, 8 a 10 horas. Cansaço acumulado nota-se primeiro na concentração e no humor.'],
  ['Comer antes de jogar','Refeição leve 2 a 3 horas antes (massa, arroz, pão, fruta). Evitar fritos e doces mesmo antes. Água sempre na mochila.'],
  ['Escola e desporto puxam um pelo outro','A mesma disciplina que se treina no pavilhão — chegar a horas, repetir, não desistir — serve para estudar. Registe as notas na app e fale disso com o treinador.']]},
 {t:'Sentir',i:'💛',c:[
  ['Depois do jogo: primeiro a pergunta certa','«Divertiste-te?» antes de «Ganharam?». E depois apenas: «Adoro ver-te jogar.»'],
  ['Na derrota, acolher antes de corrigir','Deixe a emoção acontecer. «Estás chateado, faz sentido.» A análise do jogo pode esperar pelo dia seguinte — ou ficar para o treinador.'],
  ['Atenção aos sinais','Se a criança deixa de querer ir ao treino, dorme mal antes dos jogos ou fica muito frustrada, registe em «Emoções» e fale com o treinador.']]},
 {t:'Ser',i:'🌱',c:[
  ['Elogiar o esforço, não o talento','«Foste sempre atrás da bola» constrói mais do que «és o melhor». O esforço depende dela; o talento não.'],
  ['O exemplo fala mais alto','Cumprimentar o árbitro, aplaudir o adversário, respeitar o treinador. Os miúdos copiam o que veem nos pais.'],
  ['Objetivos pequenos, vitórias diárias','Um objetivo de cada vez, escolhido com a criança. Cumpriu? Celebre. É assim que se constrói confiança.']]}
];
function vGuia(){
  const G=isCoach()?GUIA_TREINADOR:isAtleta()?GUIA_ATLETA:GUIA;
  $('#main').innerHTML=`<div class="card"><h2>${isCoach()?'Guia do Treinador 3S':isAtleta()?'Guia do Atleta 3S':'Guia Pai 3S'}</h2><p class="muted" style="margin:0">${isCoach()?'Ideias para treinar crianças e jovens com o método Saber, Sentir, Ser da Escola 3S.':isAtleta()?'Dicas para cresceres no futsal e fora dele, com o método Saber, Sentir, Ser.':'Pequenas ideias para acompanhar o seu filho no futsal com o método Saber, Sentir, Ser da Escola 3S.'}</p></div>
  ${cartaoRegras()}${cartaoPodcasts()}${!isCoach()&&!isAtleta()?`<div class="card" style="border:2px solid var(--gold)"><h2>🤝 Ajuda aos pais</h2><p class="muted" style="margin-top:0">Como usar a app, o jogo visto da bancada e cuidar de quem cuida.</p><button class="btn gold full" onclick="irPara('ajuda')">Abrir</button></div>`:''}
  ${S.meus[0]?`<div class="card" style="background:var(--mint-soft)"><h2>💚 Crescer bem</h2><p class="muted" style="margin-top:0">Adolescência, saúde mental e prevenção do tabaco, álcool e drogas.</p><button class="btn full" style="background:var(--mint)" onclick="abrirJogador('${S.meus[0].id}','bem')">Abrir</button></div>`:''}
  ${G.map(s=>`<div class="card"><h2>${s.i} ${s.t}</h2>${s.c.map(([a,b])=>`<div class="tip"><b>${a}</b><span class="muted" style="font-size:14px">${b}</span></div>`).join('')}</div>`).join('')}
  <div class="card"><h2>🎒 Mochila do jogo</h2>${['Equipamento completo','Caneleiras','Sapatilhas de pavilhão','Garrafa de água','Toalha e muda de roupa','Lanche para depois'].map(x=>`<label class="check"><input type="checkbox"> ${x}</label>`).join('')}</div>`;
}

/* ---------- conta ---------- */
function abrirConta(){
  openSheet(`<h2>${esc(S.perfil.nome)}</h2><p class="muted">${isAdminModo()?'Administradora':isCoach()?'Treinador(a)':isAtleta()?'Atleta':'Pai / Mãe'}</p>
  ${S.equipas.length>1?`<label class="f">Equipa</label><select id="cEqSel" class="in" onchange="mudarEquipa(this.value)">${S.equipas.map(e=>`<option value="${e.id}" ${e.id===S.eq.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>`:''}
  ${isCoach()?`<button class="btn full" style="margin-top:10px;background:#25D366" onclick="irAcessos()">🔑 Acessos de pais e atletas</button>`:''}
  ${isCoach()?`<div class="card" style="margin-top:14px"><b>Código da equipa</b><p class="muted" style="margin:4px 0 8px">Os pais usam-no para entrar.</p><span class="code">${esc(S.eq.codigo)}</span></div>`:''}
  ${S.admin?`<button class="btn gold full" style="margin-top:8px" onclick="escolherVista()">👁️ Ver a app como treinador, pais ou atleta</button>`:''}
  <label class="f" for="cNome">Nome</label><input id="cNome" class="in" value="${esc(S.perfil.nome)}">
  <label class="f" for="cTel">Telemóvel (para boleias)</label><input id="cTel" class="in" type="tel" value="${esc(S.perfil.telefone||'')}">
  <button class="btn full" style="margin-top:12px" onclick="guardarConta()">Guardar</button>
  ${isCoach()?`<button class="btn ghost full" style="margin-top:8px" onclick="closeSheet();S.perfil.papel='treinador';ecraSemEquipa()">+ Criar outra equipa</button>`:`<button class="btn ghost full" style="margin-top:8px" onclick="closeSheet();ecraSemEquipa()">+ Entrar noutra equipa</button>`}
  <button class="btn ghost full" style="margin-top:8px" onclick="pinConta()">🔢 ${pinGet(S.me)?'Mudar o PIN':'Criar PIN de 4 dígitos'}</button>${pinGet(S.me)?`<button class="btn ghost full sm" style="margin-top:6px" onclick="pinRemover()">Remover PIN deste telemóvel</button>`:''}
  <button class="btn ghost full" style="margin-top:8px" onclick="novaPass()">Mudar palavra-passe</button>
  <button class="btn red full" style="margin-top:8px" onclick="sair()">Sair</button>`)}
async function guardarConta(){const r={nome:g('cNome')||S.perfil.nome,telefone:g('cTel')||null};await q(sb.from('fut_perfis').update(r).eq('user_id',S.me));Object.assign(S.perfil,r);closeSheet();render();toast('Guardado')}
function escolherVista(){
  const js=S.jogadores;const m=modoVer();
  openSheet(`<h2>👁️ Ver a app como</h2><p class="muted">Veja exatamente o que cada pessoa vê. Pode voltar a Administradora quando quiser.</p>
  <div class="list">
    <button class="item" onclick="mudarModo('admin')"><div class="av navy">🛡️</div><div class="grow"><b>Administradora</b><div class="muted">Tudo, em todas as equipas</div></div>${m==='admin'?'<span class="chip mint">✔</span>':''}</button>
    <button class="item" onclick="mudarModo('treinador')"><div class="av navy">🧢</div><div class="grow"><b>Treinador</b><div class="muted">${esc(S.eq.nome)}: equipa, checklist, pódios, grelha, plano de ação</div></div>${m==='treinador'?'<span class="chip mint">✔</span>':''}</button>
  </div>
  <label class="f" for="vjSel">Atleta para ver como pais ou como atleta</label>
  <select id="vjSel" class="in">${js.map(j=>`<option value="${j.id}" ${S.verJog===j.id?'selected':''}>${esc(j.nome)}</option>`).join('')||'<option value="">Sem jogadores nesta equipa</option>'}</select>
  <div class="row" style="gap:8px;margin-top:10px"><button class="btn grow ${m==='pai'?'gold':''}" ${js.length?'':'disabled'} onclick="mudarModo('pai',document.getElementById('vjSel').value)">👨‍👩‍👦 Ver como pais</button><button class="btn grow ${m==='atleta'?'gold':''}" ${js.length?'':'disabled'} onclick="mudarModo('atleta',document.getElementById('vjSel').value)">⚽ Ver como atleta</button></div>
  <button class="btn ghost full sm" style="margin-top:10px" onclick="mudarModo('pai',null)">👨‍👩‍👦 Ver como mãe dos meus filhos</button>`)}
async function mudarModo(m,jid){S.modo=m;if(jid!==undefined){S.verJog=jid;try{localStorage.setItem('fut_verjog',jid||'')}catch(_){}}try{localStorage.setItem('fut_modo',m)}catch(_){}S.jog=null;S.tab='inicio';closeSheet();await carregar();render()}
async function mudarEquipa(id){try{localStorage.setItem('fut_eq',id)}catch(_){}S.eq=S.equipas.find(e=>e.id===id);S.jog=null;closeSheet();await carregar();render();if(S._abrir){const [a,b]=S._abrir;S._abrir=null;abrirJogador(a,b)}}

/* ---------- arranque ---------- */
(async()=>{
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(novaPass,300)});
  const tk=new URLSearchParams(location.search).get('q');
  if(tk&&/^[a-f0-9]{32}$/.test(tk)){ecraConvite(tk);return}
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){if(pinGet(session.user.id)){S._bloq=true;pinPedir(session.user.id,()=>depoisLogin(session.user))}else await depoisLogin(session.user)} else ecraLogin();
})();
</script>
